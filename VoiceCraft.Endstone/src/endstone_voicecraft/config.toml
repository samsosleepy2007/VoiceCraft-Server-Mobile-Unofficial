[tracking]
interval_ticks = 2
position_epsilon = 0.05
rotation_epsilon = 1.0
log_position_changes = false
heartbeat_seconds = 30

[binding]
min_key_length = 4
max_key_length = 128

[voice_range]
default_blocks = 20
max_blocks = 150

[bridge]
# Primary relay is required. backup_urls is optional and may contain any
# number of additional relay endpoints. Every relay uses the same server_id
# and secret. Each relay is tried max_attempts times before failover.
enabled = false
url = "wss://YOUR-RELAY.onrender.com/bridge"
backup_urls = []
server_id = "mcsv-main"
secret = "CHANGE_ME_TO_THE_SAME_BRIDGE_SECRET"
reconnect_seconds = 5
max_attempts = 5
peer_timeout_seconds = 30
