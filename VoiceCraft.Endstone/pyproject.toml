[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "endstone-voicecraft"
version = "0.2.10"
description = "VoiceCraft Endstone player-state, DDUI bind lifecycle, auto rebind, multi-relay, Item Mic and outgoing voice range bridge for VoiceCraft Server Mobile"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["aiohttp>=3.9"]
license = { text = "GPL-3.0-or-later" }
authors = [
  { name = "SamSoSleepy" }
]
keywords = ["endstone", "minecraft", "bedrock", "voicecraft", "proximity-voice"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]

[project.entry-points."endstone"]
voicecraft = "endstone_voicecraft:VoiceCraftEndstone"

[tool.hatch.build.targets.wheel]
packages = ["src/endstone_voicecraft"]

[tool.hatch.build]
include = [
  "src/endstone_voicecraft/**/*.py",
  "src/endstone_voicecraft/config.toml",
]
