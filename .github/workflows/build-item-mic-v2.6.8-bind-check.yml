name: Build Item Mic 2.6.8 Bind Check Handshake

on:
  push:
    branches: [mcsv-endweave-v2]
    paths:
      - "tools/build_item_mic_addon.py"
      - "tools/build_item_mic_voice_range_addon.py"
      - "tools/build_item_mic_v2_5_ddui_addon.py"
      - "tools/build_item_mic_v2_5_5_ddui_addon.py"
      - "tools/build_item_mic_v2_6_5_ddui_bind_addon.py"
      - "tools/build_item_mic_v2_6_6_ddui_bind_addon.py"
      - "tools/build_item_mic_v2_6_7_ddui_bind_addon.py"
      - "tools/build_item_mic_v2_6_8_ddui_bind_addon.py"
      - ".github/workflows/build-item-mic-v2.6.8-bind-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/build_item_mic_addon.py"
      - "tools/build_item_mic_voice_range_addon.py"
      - "tools/build_item_mic_v2_5_ddui_addon.py"
      - "tools/build_item_mic_v2_5_5_ddui_addon.py"
      - "tools/build_item_mic_v2_6_5_ddui_bind_addon.py"
      - "tools/build_item_mic_v2_6_6_ddui_bind_addon.py"
      - "tools/build_item_mic_v2_6_7_ddui_bind_addon.py"
      - "tools/build_item_mic_v2_6_8_ddui_bind_addon.py"
      - ".github/workflows/build-item-mic-v2.6.8-bind-check.yml"
  workflow_dispatch:

jobs:
  build-addon:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: python -m pip install pillow

      - name: Compile builders
        run: |
          set -euo pipefail
          python -m py_compile             tools/build_item_mic_addon.py             tools/build_item_mic_voice_range_addon.py             tools/build_item_mic_v2_5_ddui_addon.py             tools/build_item_mic_v2_5_5_ddui_addon.py             tools/build_item_mic_v2_6_5_ddui_bind_addon.py             tools/build_item_mic_v2_6_6_ddui_bind_addon.py             tools/build_item_mic_v2_6_7_ddui_bind_addon.py             tools/build_item_mic_v2_6_8_ddui_bind_addon.py

      - name: Build addon
        run: |
          set -euo pipefail
          mkdir -p test-assets
          python tools/build_item_mic_v2_6_8_ddui_bind_addon.py             .             test-assets/VoiceCraft_ItemMic_v2.6.8_DDUI-Bind.mcaddon
          test -s test-assets/VoiceCraft_ItemMic_v2.6.8_DDUI-Bind.mcaddon

      - name: Validate Endstone-authoritative Mic routing
        shell: bash
        run: |
          set -euo pipefail
          rm -rf check
          mkdir -p check/top check/bp check/rp

          unzip -q test-assets/VoiceCraft_ItemMic_v2.6.8_DDUI-Bind.mcaddon -d check/top
          unzip -q check/top/VoiceCraft_ItemMic_BP_v2.6.8.mcpack -d check/bp
          unzip -q check/top/VoiceCraft_ItemMic_RP_v2.6.8.mcpack -d check/rp

          test "$(jq -r '.header.version | join(".")' check/bp/manifest.json)" = "2.6.8"
          test "$(jq -r '.header.version | join(".")' check/rp/manifest.json)" = "2.6.8"
          test "$(jq -r '.dependencies[] | select(.module_name=="@minecraft/server-ui") | .version' check/bp/manifest.json)" = "2.1.0"
          test "$(jq -r '.dependencies[] | select(.module_name=="@minecraft/server") | .version' check/bp/manifest.json)" = "2.9.0"

          script=check/bp/scripts/main.js
          node --check "$script"

          grep -Fq 'voicecraft.bind.check.' "$script"
          grep -Fq 'voicecraft.bind.check_result.' "$script"
          grep -Fq 'function nextBindCheckId()' "$script"
          grep -Fq 'function consumeBindCheckResult(player, requestId)' "$script"
          grep -Fq 'function routeMicByAuthoritativeState(player, state)' "$script"
          grep -Fq 'function pollMicBindCheck(player, requestId, attemptsLeft)' "$script"
          grep -Fq 'player.addTag(BIND_CHECK_PREFIX + requestId);' "$script"
          grep -Fq 'bindCheckPendingByPlayer.set(player.id, requestId);' "$script"
          grep -Fq 'Loaded v2.6.8' "$script"

          python - <<'PY'
          from pathlib import Path

          text = Path("check/bp/scripts/main.js").read_text(encoding="utf-8")

          use_start = text.index("function handleMicUse(player)")
          use_end = text.index("function ensureBindDduiReady", use_start)
          use_body = text[use_start:use_end]

          # The Mic button MUST ask Endstone; it must not make the final
          # decision from bindState()/scoreboard state locally.
          assert "player.addTag(BIND_CHECK_PREFIX + requestId)" in use_body
          assert "pollMicBindCheck(player, requestId, 20)" in use_body
          assert "bindState(player)" not in use_body
          assert 'const state = bindState(player)' not in use_body

          route_start = text.index("function routeMicByAuthoritativeState")
          route_end = text.index("function pollMicBindCheck", route_start)
          route = text[route_start:route_end]

          # Only the Endstone response controls the route.
          bound = route[
              route.index('if (state === "bound")'):
              route.index('if (state === "pending")')
          ]
          assert "showSettings(player);" in bound
          assert "openBindFromMic(player);" not in bound

          assert 'state === "unbound"' in route
          assert 'state === "error"' in route
          assert 'state === "reconnecting"' in route
          assert 'state === "rebind_required"' in route
          assert "openBindFromMic(player);" in route
          assert 'state === "disconnecting"' in route

          # Timeout must not guess unbound.
          poll_start = text.index("function pollMicBindCheck")
          poll_end = text.index("function handleMicUse", poll_start)
          poll = text[poll_start:poll_end]
          assert "ไม่สามารถตรวจสอบสถานะการเชื่อมต่อได้ กรุณาลองใหม่" in poll
          assert "openBindFromMic(player);" not in poll

          # Remove the 2.6.7 local-delay workaround entirely.
          assert "bindStateCheckPlayers" not in text
          assert "const refreshedState = bindState(player);" not in text

          # Previously accepted systems remain intact.
          assert "voicecraft.vr.ack." in text
          assert "voicecraft.vr.sync." in text
          assert "submittedCloseRequested" in text
          assert "bind DDUI submit-close failed" in text
          assert "function openBindFromMic(player)" in text

          print("Item Mic 2.6.8 Endstone-authoritative Bind routing verified")
          PY

          ! grep -Fq 'ActionFormData' "$script"
          ! grep -Fq 'ModalFormData' "$script"
          ! grep -Fq 'multiButtonRow' "$script"

          test -s check/rp/attachables/mic_off.entity.json
          test -s check/rp/models/entity/voicecraft_mic_invisible.geo.json

      - name: Confirm 2.6.7 rollback still builds
        run: |
          set -euo pipefail
          python tools/build_item_mic_v2_6_7_ddui_bind_addon.py             .             test-assets/VoiceCraft_ItemMic_v2.6.7_DDUI-Bind_rollback.mcaddon
          test -s test-assets/VoiceCraft_ItemMic_v2.6.7_DDUI-Bind_rollback.mcaddon

      - name: Upload addon
        uses: actions/upload-artifact@v4
        with:
          name: VoiceCraft-ItemMic-v2.6.8-Bind-Check-Handshake
          path: test-assets/VoiceCraft_ItemMic_v2.6.8_DDUI-Bind.mcaddon
          if-no-files-found: error
