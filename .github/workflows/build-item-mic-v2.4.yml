name: Build Item Mic v2.4

on:
  workflow_dispatch:
  push:
    branches: [item-mic-v2.4-hidden-single]
    paths:
      - "tools/build_item_mic_addon.py"
      - "tools/build_item_mic_voice_range_addon.py"
      - "tools/build_item_mic_v2_4_addon.py"
      - ".github/workflows/build-item-mic-v2.4.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/build_item_mic_addon.py"
      - "tools/build_item_mic_voice_range_addon.py"
      - "tools/build_item_mic_v2_4_addon.py"
      - ".github/workflows/build-item-mic-v2.4.yml"

jobs:
  build-item-mic:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install builder dependencies
        run: python -m pip install pillow

      - name: Compile builders
        run: python -m compileall -q tools/build_item_mic_addon.py tools/build_item_mic_voice_range_addon.py tools/build_item_mic_v2_4_addon.py

      - name: Build Item Mic 2.4.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-assets
          python tools/build_item_mic_v2_4_addon.py . test-assets/VoiceCraft_ItemMic_v2.4.0.mcaddon
          test -s test-assets/VoiceCraft_ItemMic_v2.4.0.mcaddon

      - name: Validate hidden single Mic package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf itemmic-check
          mkdir -p itemmic-check/bp itemmic-check/rp
          unzip -q test-assets/VoiceCraft_ItemMic_v2.4.0.mcaddon -d itemmic-check
          test -s itemmic-check/VoiceCraft_ItemMic_BP_v2.4.0.mcpack
          test -s itemmic-check/VoiceCraft_ItemMic_RP_v2.4.0.mcpack
          unzip -q itemmic-check/VoiceCraft_ItemMic_BP_v2.4.0.mcpack -d itemmic-check/bp
          unzip -q itemmic-check/VoiceCraft_ItemMic_RP_v2.4.0.mcpack -d itemmic-check/rp
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          root = Path("itemmic-check")
          bp = root / "bp"
          rp = root / "rp"

          bp_manifest = json.loads((bp / "manifest.json").read_text(encoding="utf-8"))
          rp_manifest = json.loads((rp / "manifest.json").read_text(encoding="utf-8"))
          assert bp_manifest["header"]["version"] == [2, 4, 0]
          assert rp_manifest["header"]["version"] == [2, 4, 0]

          item_paths = [
              "items/mic_off.item.json",
              "items/mic_on.item.json",
              "items/mic_hold.item.json",
              "items/mic_toggle.item.json",
          ]
          expected_ids = {
              "voicecraft:mic_off",
              "voicecraft:mic_on",
              "voicecraft:mic_hold",
              "voicecraft:mic_toggle",
          }
          found = set()
          for rel in item_paths:
              data = json.loads((bp / rel).read_text(encoding="utf-8"))
              desc = data["minecraft:item"]["description"]
              assert desc["menu_category"]["category"] == "none", rel
              found.add(desc["identifier"])
          assert found == expected_ids

          script = (bp / "scripts/main.js").read_text(encoding="utf-8")
          for marker in (
              "function enforceSingleMic(player)",
              "MIC_DUPLICATE_REMOVED",
              "selectedSlotIndex",
              "inv.setItem(i, undefined)",
              "voicecraft.vr.request.",
              "PlayerPermissionLevel.Operator",
              "Loaded v2.4.0",
          ):
              assert marker in script, marker
          # The duplicate guard must run in the hot evaluate path as well as ensureMic.
          assert script.count("enforceSingleMic(player);") >= 2

          attachables = {
              "attachables/mic_off.entity.json": "voicecraft:mic_off",
              "attachables/mic_on.entity.json": "voicecraft:mic_on",
              "attachables/mic_hold.entity.json": "voicecraft:mic_hold",
              "attachables/mic_toggle.entity.json": "voicecraft:mic_toggle",
          }
          for rel, identifier in attachables.items():
              data = json.loads((rp / rel).read_text(encoding="utf-8"))
              desc = data["minecraft:attachable"]["description"]
              assert desc["identifier"] == identifier
              assert desc["geometry"]["default"] == "geometry.voicecraft.mic_invisible"
              assert desc["textures"]["default"] == "textures/entity/voicecraft_mic_invisible"
              assert desc["render_controllers"] == ["controller.render.voicecraft_mic_invisible"]

          geo = json.loads((rp / "models/entity/voicecraft_mic_invisible.geo.json").read_text(encoding="utf-8"))
          geometry = geo["minecraft:geometry"][0]
          assert geometry["description"]["identifier"] == "geometry.voicecraft.mic_invisible"
          assert geometry["bones"][0].get("cubes") == []

          rc = json.loads((rp / "render_controllers/voicecraft_mic_invisible.render_controllers.json").read_text(encoding="utf-8"))
          assert "controller.render.voicecraft_mic_invisible" in rc["render_controllers"]

          with Image.open(rp / "textures/entity/voicecraft_mic_invisible.png") as image:
              rgba = image.convert("RGBA")
              assert rgba.size == (1, 1)
              assert rgba.getpixel((0, 0))[3] == 0

          # Inventory icons remain visible even though the held attachable is invisible.
          for icon in ("icon_mic_off.png", "icon_mic_on.png"):
              with Image.open(rp / "textures/items" / icon) as image:
                  rgba = image.convert("RGBA")
                  assert any(pixel[3] > 0 for pixel in rgba.getdata()), icon

          print("Item Mic 2.4 hidden/single package validated")
          PY

      - name: Upload Item Mic 2.4 test addon
        uses: actions/upload-artifact@v4
        with:
          name: VoiceCraft-ItemMic-v2.4.0-HiddenSingle-Test
          if-no-files-found: error
          path: test-assets/VoiceCraft_ItemMic_v2.4.0.mcaddon
