name: Build Endstone 0.2.15 Bind State Integrity

on:
  push:
    branches: [mcsv-endweave-v2]
    paths:
      - "VoiceCraft.Endstone/**"
      - ".github/workflows/build-endstone-0.2.15-bind-state.yml"
  pull_request:
    branches: [main]
    paths:
      - "VoiceCraft.Endstone/**"
      - ".github/workflows/build-endstone-0.2.15-bind-state.yml"
  workflow_dispatch:

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build and Endstone API
        run: |
          python -m pip install --upgrade pip
          python -m pip install build "endstone==0.11.10" "aiohttp>=3.9"

      - name: Compile Endstone source
        run: python -m compileall -q VoiceCraft.Endstone/src VoiceCraft.Endstone/tests

      - name: Validate canonical Bind identity and state reconciliation
        env:
          PYTHONPATH: VoiceCraft.Endstone/src
        run: |
          python - <<'PY'
          import inspect
          from types import SimpleNamespace

          from endstone_voicecraft import VoiceCraftEndstone
          from endstone_voicecraft.plugin import VoiceCraftEndstone as Core
          from endstone_voicecraft.auto_bind import VoiceCraftEndstone as AutoBind
          from endstone_voicecraft.auto_rebind import VoiceCraftEndstone as AutoRebind
          from endstone_voicecraft.ddui_bind import (
              VoiceCraftEndstone as Ddui,
              BIND_STATE_PREFIX,
              BIND_OPEN_PREFIX,
              STATE_UNBOUND,
              STATE_PENDING,
              STATE_BOUND,
              STATE_RECONNECTING,
              STATE_REBIND_REQUIRED,
              STATE_ERROR,
              STATE_DISCONNECTING,
          )

          assert VoiceCraftEndstone is Ddui
          assert VoiceCraftEndstone.version == "0.2.15"

          class FakePlayer:
              def __init__(self, xuid="x1", uuid="u1", name="Tester", tags=()):
                  self.xuid = xuid
                  self.unique_id = uuid
                  self.name = name
                  self.scoreboard_tags = list(tags)

              def add_scoreboard_tag(self, tag):
                  if tag not in self.scoreboard_tags:
                      self.scoreboard_tags.append(tag)

              def remove_scoreboard_tag(self, tag):
                  if tag in self.scoreboard_tags:
                      self.scoreboard_tags.remove(tag)

          class Logger:
              def info(self, *args, **kwargs): pass
              def warning(self, *args, **kwargs): pass

          class Harness:
              _resolve_bind_player_key = Core._resolve_bind_player_key
              _authoritative_bind_state = Ddui._authoritative_bind_state
              _reconcile_bind_state_tag = Ddui._reconcile_bind_state_tag
              _player_key = staticmethod(Core._player_key)

          player = FakePlayer()
          h = Harness()
          h.server = SimpleNamespace(online_players=[player])
          h._states = {}
          h._pending_bind_keys = {"x1": "secret"}
          h._pending_bind_requests = {"x1": "req-123"}
          h._pending_unbind_requests = {}
          h._bound_players = set()
          h._rebind_waiting = set()
          h.logger = Logger()

          # requestId is authoritative even if bridge identity hints are wrong.
          resolved = h._resolve_bind_player_key({
              "requestId": "req-123",
              "xuid": "wrong-xuid",
              "uuid": "wrong-uuid",
              "success": True,
          })
          assert resolved == "x1", resolved

          # UUID fallback maps back to the canonical XUID player key.
          h._pending_bind_requests.clear()
          resolved = h._resolve_bind_player_key({
              "requestId": "unknown",
              "xuid": "",
              "uuid": "u1",
              "success": True,
          })
          assert resolved == "x1", resolved

          # Stale unbound must be repaired to bound without deleting open token.
          player.scoreboard_tags[:] = [
              BIND_STATE_PREFIX + STATE_UNBOUND,
              BIND_OPEN_PREFIX + "77",
          ]
          h._bound_players.add("x1")
          state = h._reconcile_bind_state_tag(player)
          assert state == STATE_BOUND
          assert player.scoreboard_tags.count(BIND_STATE_PREFIX + STATE_BOUND) == 1
          assert not any(t == BIND_STATE_PREFIX + STATE_UNBOUND for t in player.scoreboard_tags)
          assert BIND_OPEN_PREFIX + "77" in player.scoreboard_tags

          # Runtime states outrank stale tags.
          h._bound_players.clear()
          h._pending_bind_keys["x1"] = "secret"
          player.scoreboard_tags[:] = [BIND_STATE_PREFIX + STATE_BOUND]
          assert h._reconcile_bind_state_tag(player) == STATE_PENDING
          assert player.scoreboard_tags == [BIND_STATE_PREFIX + STATE_PENDING]

          h._pending_bind_keys.clear()
          h._rebind_waiting.add("x1")
          player.scoreboard_tags[:] = [BIND_STATE_PREFIX + STATE_BOUND]
          assert h._reconcile_bind_state_tag(player) == STATE_RECONNECTING

          h._rebind_waiting.clear()
          h._pending_unbind_requests["x1"] = "unbind-1"
          player.scoreboard_tags[:] = [BIND_STATE_PREFIX + STATE_BOUND]
          assert h._reconcile_bind_state_tag(player) == STATE_DISCONNECTING

          # UI-only error/rebind states remain until a stronger runtime state exists.
          h._pending_unbind_requests.clear()
          player.scoreboard_tags[:] = [BIND_STATE_PREFIX + STATE_ERROR]
          assert h._reconcile_bind_state_tag(player) == STATE_ERROR
          player.scoreboard_tags[:] = [BIND_STATE_PREFIX + STATE_REBIND_REQUIRED]
          assert h._reconcile_bind_state_tag(player) == STATE_REBIND_REQUIRED

          # Duplicate state tags are collapsed to exactly one authoritative tag.
          h._bound_players.add("x1")
          player.scoreboard_tags[:] = [
              BIND_STATE_PREFIX + STATE_UNBOUND,
              BIND_STATE_PREFIX + STATE_ERROR,
              BIND_STATE_PREFIX + STATE_BOUND,
          ]
          assert h._reconcile_bind_state_tag(player) == STATE_BOUND
          state_tags = [t for t in player.scoreboard_tags if t.startswith(BIND_STATE_PREFIX)]
          assert state_tags == [BIND_STATE_PREFIX + STATE_BOUND], state_tags

          # Every bind-result layer must resolve canonical identity before calling super.
          for cls in (AutoBind, AutoRebind, Ddui):
              source = inspect.getsource(cls._handle_bind_result)
              assert "self._resolve_bind_player_key(message)" in source
              assert source.index("self._resolve_bind_player_key(message)") < source.index("super()._handle_bind_result(message)")

          ddui_source = inspect.getsource(Ddui._handle_bind_result)
          assert "self._bound_players.add(player_key)" in ddui_source
          assert "self._publish_bind_state(player, STATE_BOUND)" in ddui_source

          derived_source = inspect.getsource(Ddui._publish_derived_bind_state)
          assert "_reconcile_bind_state_tag" in derived_source

          print("Endstone 0.2.15 Bind-state integrity contract OK")
          PY

      - name: Build wheel
        working-directory: VoiceCraft.Endstone
        run: python -m build --wheel

      - name: Validate wheel and installed entrypoint
        working-directory: VoiceCraft.Endstone
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob
          import zipfile

          wheels = glob.glob("dist/*.whl")
          assert len(wheels) == 1, wheels
          wheel = wheels[0]
          assert "0.2.15" in wheel, wheel

          with zipfile.ZipFile(wheel) as zf:
              names = set(zf.namelist())
              assert "endstone_voicecraft/plugin.py" in names
              assert "endstone_voicecraft/ddui_bind.py" in names
              metadata_name = next(name for name in names if name.endswith(".dist-info/METADATA"))
              metadata = zf.read(metadata_name).decode("utf-8")
              assert "Version: 0.2.15" in metadata
          print("Validated", wheel)
          PY

          python -m pip install --no-deps --force-reinstall dist/*.whl
          python - <<'PY'
          from endstone_voicecraft import VoiceCraftEndstone
          assert VoiceCraftEndstone.version == "0.2.15"
          assert hasattr(VoiceCraftEndstone, "_resolve_bind_player_key")
          assert hasattr(VoiceCraftEndstone, "_reconcile_bind_state_tag")
          print("Installed Endstone 0.2.15 wheel import OK")
          PY

      - name: Upload Endstone 0.2.15 wheel
        uses: actions/upload-artifact@v4
        with:
          name: VoiceCraft-Endstone-0.2.15-Bind-State-Integrity
          if-no-files-found: error
          path: VoiceCraft.Endstone/dist/*.whl
