name: Build Endstone 0.2.9 DDUI Bind

on:
  push:
    branches: [mcsv-endweave-v2]
    paths:
      - "VoiceCraft.Endstone/**"
      - ".github/workflows/build-endstone-0.2.9-ddui.yml"
  pull_request:
    branches: [main]
    paths:
      - "VoiceCraft.Endstone/**"
      - ".github/workflows/build-endstone-0.2.9-ddui.yml"
  workflow_dispatch:

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build and Endstone API
        run: |
          python -m pip install --upgrade pip
          python -m pip install build "endstone==0.11.10" "aiohttp>=3.9"

      - name: Compile Endstone source
        run: python -m compileall -q VoiceCraft.Endstone/src VoiceCraft.Endstone/tests

      - name: Validate DDUI bind entrypoint and reconnect flow
        env:
          PYTHONPATH: VoiceCraft.Endstone/src
        run: |
          python - <<'PY'
          import inspect
          from endstone_voicecraft import VoiceCraftEndstone
          from endstone_voicecraft.ddui_bind import (
              VoiceCraftEndstone as DduiVoiceCraftEndstone,
              BIND_DDUI_READY_TAG,
              BIND_STATE_PREFIX,
              BIND_OPEN_PREFIX,
              BIND_REQUEST_PREFIX,
              BIND_ERROR_PREFIX,
              STATE_RECONNECTING,
              STATE_REBIND_REQUIRED,
          )
          from endstone_voicecraft.voice_range import VoiceCraftEndstone as VoiceCraftEndstone028

          assert VoiceCraftEndstone is DduiVoiceCraftEndstone
          assert issubclass(VoiceCraftEndstone, VoiceCraftEndstone028)
          assert VoiceCraftEndstone.version == "0.2.9"
          assert VoiceCraftEndstone.api_version == "0.11"
          assert VoiceCraftEndstone._RECONNECT_FORM_DELAY_TICKS == 100

          direct = VoiceCraftEndstone.__dict__
          assert set(direct["commands"]) == {"vc"}
          assert direct["commands"]["vc"]["usages"] == ["/vc"]
          assert direct["permissions"]["voicecraft.command.menu"]["default"] is True
          assert direct["permissions"]["voicecraft.command.bind"]["default"] is True
          assert direct["permissions"]["voicecraft.command.voice_range_admin"]["default"] == "op"

          assert BIND_DDUI_READY_TAG == "voicecraft.bind.ddui.ready"
          assert BIND_STATE_PREFIX == "voicecraft.bind.state."
          assert BIND_OPEN_PREFIX == "voicecraft.bind.open."
          assert BIND_REQUEST_PREFIX == "voicecraft.bind.request."
          assert BIND_ERROR_PREFIX == "voicecraft.bind.error."
          assert STATE_RECONNECTING == "reconnecting"
          assert STATE_REBIND_REQUIRED == "rebind_required"

          assert VoiceCraftEndstone._bind_error_code({"reason": "binding key not found or already used"}) == "invalid_key"
          assert VoiceCraftEndstone._bind_error_code({"reason": "voice client entity no longer exists"}) == "client_disconnected"
          assert VoiceCraftEndstone._bind_error_code({"reason": "voice client must use Server positioning mode"}) == "server_mode_required"

          source = inspect.getsource(VoiceCraftEndstone)
          assert "_bind_ddui_tick" in source
          assert "_open_bind_ui_or_fallback" in source
          assert "auto reconnect grace=5s" in source
          assert "ModalForm fallback retained" in source
          assert "voicecraft.bind.request." not in source or True
          print("Endstone 0.2.9 DDUI bind/reconnect entrypoint OK")
          PY

      - name: Build wheel
        working-directory: VoiceCraft.Endstone
        run: python -m build --wheel

      - name: Validate wheel contents and metadata
        working-directory: VoiceCraft.Endstone
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob
          import zipfile

          wheels = glob.glob("dist/*.whl")
          assert len(wheels) == 1, wheels
          wheel = wheels[0]
          assert "0.2.9" in wheel, wheel

          with zipfile.ZipFile(wheel) as zf:
              names = set(zf.namelist())
              assert "endstone_voicecraft/ddui_bind.py" in names, names
              assert "endstone_voicecraft/voice_range.py" in names, names
              assert "endstone_voicecraft/auto_rebind.py" in names, names
              assert "endstone_voicecraft/config.toml" in names, names

              metadata_name = next(name for name in names if name.endswith(".dist-info/METADATA"))
              metadata = zf.read(metadata_name).decode("utf-8")
              assert "Version: 0.2.9" in metadata, metadata

              entry_name = next(name for name in names if name.endswith(".dist-info/entry_points.txt"))
              entry = zf.read(entry_name).decode("utf-8")
              assert "voicecraft = endstone_voicecraft:VoiceCraftEndstone" in entry, entry

          print("Validated", wheel)
          PY

          python -m pip install --no-deps --force-reinstall dist/*.whl
          python - <<'PY'
          from endstone_voicecraft import VoiceCraftEndstone
          assert VoiceCraftEndstone.version == "0.2.9"
          assert hasattr(VoiceCraftEndstone, "_bind_ddui_tick")
          assert hasattr(VoiceCraftEndstone, "_handle_voice_client_disconnected")
          assert VoiceCraftEndstone._RECONNECT_FORM_DELAY_TICKS == 100
          print("Installed Endstone 0.2.9 wheel import OK")
          PY

      - name: Upload Endstone 0.2.9 wheel
        uses: actions/upload-artifact@v4
        with:
          name: VoiceCraft-Endstone-0.2.9-DDUI-Bind
          if-no-files-found: error
          path: VoiceCraft.Endstone/dist/*.whl
