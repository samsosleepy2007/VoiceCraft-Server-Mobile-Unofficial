name: Build Item Mic 2.6.10 Settings Rebind Lifecycle

on:
  push:
    branches: [mcsv-endweave-v2]
    paths:
      - "tools/build_item_mic_addon.py"
      - "tools/build_item_mic_voice_range_addon.py"
      - "tools/build_item_mic_v2_5_ddui_addon.py"
      - "tools/build_item_mic_v2_5_5_ddui_addon.py"
      - "tools/build_item_mic_v2_6_5_ddui_bind_addon.py"
      - "tools/build_item_mic_v2_6_6_ddui_bind_addon.py"
      - "tools/build_item_mic_v2_6_7_ddui_bind_addon.py"
      - "tools/build_item_mic_v2_6_8_ddui_bind_addon.py"
      - "tools/build_item_mic_v2_6_9_ddui_bind_addon.py"
      - "tools/build_item_mic_v2_6_10_ddui_bind_addon.py"
      - ".github/workflows/build-item-mic-v2.6.10-settings-rebind.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/build_item_mic_addon.py"
      - "tools/build_item_mic_voice_range_addon.py"
      - "tools/build_item_mic_v2_5_ddui_addon.py"
      - "tools/build_item_mic_v2_5_5_ddui_addon.py"
      - "tools/build_item_mic_v2_6_5_ddui_bind_addon.py"
      - "tools/build_item_mic_v2_6_6_ddui_bind_addon.py"
      - "tools/build_item_mic_v2_6_7_ddui_bind_addon.py"
      - "tools/build_item_mic_v2_6_8_ddui_bind_addon.py"
      - "tools/build_item_mic_v2_6_9_ddui_bind_addon.py"
      - "tools/build_item_mic_v2_6_10_ddui_bind_addon.py"
      - ".github/workflows/build-item-mic-v2.6.10-settings-rebind.yml"
  workflow_dispatch:

jobs:
  build-addon:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: python -m pip install pillow

      - name: Compile builders
        run: |
          set -euo pipefail
          python -m py_compile             tools/build_item_mic_addon.py             tools/build_item_mic_voice_range_addon.py             tools/build_item_mic_v2_5_ddui_addon.py             tools/build_item_mic_v2_5_5_ddui_addon.py             tools/build_item_mic_v2_6_5_ddui_bind_addon.py             tools/build_item_mic_v2_6_6_ddui_bind_addon.py             tools/build_item_mic_v2_6_7_ddui_bind_addon.py             tools/build_item_mic_v2_6_8_ddui_bind_addon.py             tools/build_item_mic_v2_6_9_ddui_bind_addon.py             tools/build_item_mic_v2_6_10_ddui_bind_addon.py

      - name: Build addon
        run: |
          set -euo pipefail
          mkdir -p test-assets
          python tools/build_item_mic_v2_6_10_ddui_bind_addon.py             .             test-assets/VoiceCraft_ItemMic_v2.6.10_DDUI-Bind.mcaddon
          test -s test-assets/VoiceCraft_ItemMic_v2.6.10_DDUI-Bind.mcaddon

      - name: Validate Settings disconnect and rebind lifecycle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf check
          mkdir -p check/top check/bp check/rp

          unzip -q test-assets/VoiceCraft_ItemMic_v2.6.10_DDUI-Bind.mcaddon -d check/top
          unzip -q check/top/VoiceCraft_ItemMic_BP_v2.6.10.mcpack -d check/bp
          unzip -q check/top/VoiceCraft_ItemMic_RP_v2.6.10.mcpack -d check/rp

          test "$(jq -r '.header.version | join(".")' check/bp/manifest.json)" = "2.6.10"
          test "$(jq -r '.header.version | join(".")' check/rp/manifest.json)" = "2.6.10"
          test "$(jq -r '.dependencies[] | select(.module_name=="@minecraft/server-ui") | .version' check/bp/manifest.json)" = "2.1.0"
          test "$(jq -r '.dependencies[] | select(.module_name=="@minecraft/server") | .version' check/bp/manifest.json)" = "2.9.0"

          script=check/bp/scripts/main.js
          node --check "$script"

          grep -Fq 'const openSettingsForms = new Map();' "$script"
          grep -Fq 'MIC_SETTINGS_CLOSE_BIND_STATE' "$script"
          grep -Fq 'function closeMicSettingsForBind(player)' "$script"
          grep -Fq 'Mic Settings close-before-Bind failed' "$script"
          grep -Fq 'openSettingsForms.set(player.id, form);' "$script"
          grep -Fq 'openSettingsForms.delete(player.id);' "$script"
          grep -Fq 'Loaded v2.6.10' "$script"

          python - <<'PY'
          from pathlib import Path

          text = Path("check/bp/scripts/main.js").read_text(encoding="utf-8")

          settings_start = text.index("async function showSettings(player)")
          settings_end = text.index("const BIND_DDUI_READY_TAG", settings_start)
          settings = text[settings_start:settings_end]

          # Settings must be registered so Bind can actively close the exact
          # live CustomForm instead of relying only on timing.
          assert "openSettingsForms.set(player.id, form);" in settings
          assert "openSettingsForms.delete(player.id);" in settings

          # Once the connection stops being bound, Settings closes itself.
          assert 'const connectionState = bindState(player);' in settings
          assert 'if (connectionState !== "bound")' in settings
          disconnect_block = settings[
              settings.index('if (connectionState !== "bound")'):
              settings.index("const refreshed = stateFor(player);")
          ]
          assert "form.close();" in disconnect_block
          assert "MIC_SETTINGS_CLOSE_BIND_STATE" in disconnect_block

          helper_start = text.index("function closeMicSettingsForBind(player)")
          helper_end = text.index("function openBindFromMic", helper_start)
          helper = text[helper_start:helper_end]
          assert "openSettingsForms.get(player.id)" in helper
          assert "settingsForm.close();" in helper

          # Both local-Mic Bind and server-token Bind force Settings closed
          # before opening the Bind form.
          local_start = text.index("function openBindFromMic(player)")
          local_end = text.index("function nextBindCheckId", local_start)
          local = text[local_start:local_end]
          assert "closeMicSettingsForBind(player);" in local

          bind_start = text.index("async function showBindDdui(player, openToken)")
          bind_end = text.index("function pollBindDdui", bind_start)
          bind = text[bind_start:bind_end]
          assert "closeMicSettingsForBind(player);" in bind
          assert bind.index("closeMicSettingsForBind(player);") < bind.index("withholdMicForBind(player);")

          # Accepted authoritative systems remain intact.
          assert "voicecraft.bind.check." in text
          assert "voicecraft.bind.check_result." in text
          assert "function routeMicByAuthoritativeState(player, state)" in text
          assert 'if (state === "bound")' in text
          assert "restoreMicAfterBind(player);" in text
          assert "withholdMicForBind(player);" in text
          assert "voicecraft.vr.ack." in text
          assert "voicecraft.vr.sync." in text
          assert "submittedCloseRequested" in text

          print("Item Mic 2.6.10 Settings/rebind lifecycle verified")
          PY

          ! grep -Fq 'ActionFormData' "$script"
          ! grep -Fq 'ModalFormData' "$script"
          ! grep -Fq 'multiButtonRow' "$script"

          test -s check/rp/attachables/mic_off.entity.json
          test -s check/rp/models/entity/voicecraft_mic_invisible.geo.json

      - name: Confirm 2.6.9 rollback still builds
        run: |
          set -euo pipefail
          python tools/build_item_mic_v2_6_9_ddui_bind_addon.py             .             test-assets/VoiceCraft_ItemMic_v2.6.9_DDUI-Bind_rollback.mcaddon
          test -s test-assets/VoiceCraft_ItemMic_v2.6.9_DDUI-Bind_rollback.mcaddon

      - name: Upload addon
        uses: actions/upload-artifact@v4
        with:
          name: VoiceCraft-ItemMic-v2.6.10-Settings-Rebind-Lifecycle
          path: test-assets/VoiceCraft_ItemMic_v2.6.10_DDUI-Bind.mcaddon
          if-no-files-found: error
