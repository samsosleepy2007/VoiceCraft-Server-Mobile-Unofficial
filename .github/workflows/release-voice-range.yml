name: Release Voice Range StrongFade50

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "release-voice-range-manifest.json"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository and VoiceCraft v1.7.1 submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read release manifest
        shell: bash
        run: |
          set -euo pipefail
          echo "RELEASE_TAG=$(jq -r '.tag' release-voice-range-manifest.json)" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=$(jq -r '.title' release-voice-range-manifest.json)" >> "$GITHUB_ENV"
          test "$(jq -r '.android.display_version' release-voice-range-manifest.json)" = "1.7.1-android-phase2-ui5-voice-range"
          test "$(jq -r '.android.version_code' release-voice-range-manifest.json)" = "14"
          test "$(jq -r '.endstone' release-voice-range-manifest.json)" = "0.2.8"
          test "$(jq -r '.relay' release-voice-range-manifest.json)" = "0.2.1"
          test "$(jq -r '.protocol' release-voice-range-manifest.json)" = "1"
          test "$(jq -r '.item_mic' release-voice-range-manifest.json)" = "2.3.0"
          test "$(jq -r '.voicecraft_upstream_commit' release-voice-range-manifest.json)" = "85aaccccbb58adb23e8c87144e8b1c24bf4b2011"

      - name: Verify pinned upstream and GPL attribution
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C VoiceCraft.Upstream rev-parse HEAD)" = "85aaccccbb58adb23e8c87144e8b1c24bf4b2011"
          test -f LICENSE.md
          test -f NOTICE.md
          cmp -s LICENSE.md VoiceCraft.Upstream/LICENSE.md
          grep -q 'https://github.com/AvionBlock/VoiceCraft' NOTICE.md
          grep -q 'GPL-3.0' NOTICE.md

      - name: Apply Android runtime patches
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply_phase1.py VoiceCraft.Upstream
          python tools/apply_android_console_fix.py VoiceCraft.Upstream
          python tools/apply_android_tcp_mchttp.py VoiceCraft.Upstream
          python tools/apply_bridge_runtime.py VoiceCraft.Upstream
          python VoiceCraft.Guest.Patch/apply_guest_account_patch.py .
          python tools/apply_item_mic_bridge_patch.py .
          python tools/apply_voice_range_patch.py .
          python VoiceCraft.Guest.Patch/apply_legal_compliance_patch.py .

      - name: Set Android release identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          display = "1.7.1-android-phase2-ui5-voice-range"
          csproj = Path("VoiceCraft.Server.Android/VoiceCraft.Server.Android.csproj")
          text = csproj.read_text(encoding="utf-8")
          text, n1 = re.subn(r"<ApplicationVersion>\d+</ApplicationVersion>", "<ApplicationVersion>14</ApplicationVersion>", text, count=1)
          text, n2 = re.subn(r"<ApplicationDisplayVersion>[^<]+</ApplicationDisplayVersion>", f"<ApplicationDisplayVersion>{display}</ApplicationDisplayVersion>", text, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit("Could not set Android release identity")
          csproj.write_text(text, encoding="utf-8")

          bridge = Path("VoiceCraft.Server.Android/EndstoneBridgeController.cs")
          text = bridge.read_text(encoding="utf-8")
          text, n = re.subn(r'appVersion = "[^"]+"', f'appVersion = "{display}"', text, count=1)
          if n != 1:
              raise SystemExit("Could not set bridge appVersion")
          bridge.write_text(text, encoding="utf-8")
          PY

      - name: Validate Voice Range StrongFade50 release guards
        shell: bash
        run: |
          set -euo pipefail
          grep -q '<ApplicationVersion>14</ApplicationVersion>' VoiceCraft.Server.Android/VoiceCraft.Server.Android.csproj
          grep -q '<ApplicationDisplayVersion>1.7.1-android-phase2-ui5-voice-range</ApplicationDisplayVersion>' VoiceCraft.Server.Android/VoiceCraft.Server.Android.csproj
          grep -q 'appVersion = "1.7.1-android-phase2-ui5-voice-range"' VoiceCraft.Server.Android/EndstoneBridgeController.cs
          grep -q 'from .voice_range import VoiceCraftEndstone' VoiceCraft.Endstone/src/endstone_voicecraft/__init__.py
          grep -q 'version = "0.2.8"' VoiceCraft.Endstone/src/endstone_voicecraft/voice_range.py
          grep -q 'version = "0.2.8"' VoiceCraft.Endstone/pyproject.toml
          grep -q 'DEFAULT_MAX = 150' VoiceCraft.Endstone/src/endstone_voicecraft/voice_range.py
          grep -q 'default_blocks = 20' VoiceCraft.Endstone/src/endstone_voicecraft/config.toml
          grep -q 'max_blocks = 150' VoiceCraft.Endstone/src/endstone_voicecraft/config.toml
          grep -q 'VoiceRangeFadeStartRatio = 0.50f' VoiceCraft.Server.Android/EndstoneBridgeController.cs
          grep -q 'MathF.Pow(linearFactor, 1.5f)' VoiceCraft.Upstream/VoiceCraft.Network/Audio/Effects/ProximityEffect.cs
          grep -q 'Listener properties must not change another' VoiceCraft.Upstream/VoiceCraft.Network/Audio/Effects/ProximityEffect.cs
          grep -q 'one loud player cannot expand another' VoiceCraft.Upstream/VoiceCraft.Network/Audio/Effects/ProximityEffect.cs
          grep -q 'networkEntity.Muted || networkEntity.ServerMuted || itemMicMuted' VoiceCraft.Upstream/VoiceCraft.Network/Servers/VoiceCraftServer.cs
          grep -q 'RenderApiClient' VoiceCraft.Server.Android/ModernMainActivity.cs
          grep -q 'VoiceCraft by SamSoSleepy' VoiceCraft.Server.Android/ModernMainActivity.cs
          python tools/validate_voice_range_fade.py .

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install .NET Android workload
        run: dotnet workload install android

      - name: Build Android ARM64 APK
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore VoiceCraft.Server.Android/VoiceCraft.Server.Android.csproj
          dotnet build VoiceCraft.Server.Android/VoiceCraft.Server.Android.csproj -c Release --no-restore
          dotnet publish VoiceCraft.Server.Android/VoiceCraft.Server.Android.csproj -c Release -r android-arm64 --no-restore
          mkdir -p release-assets
          signed=$(find VoiceCraft.Server.Android/bin/Release/net10.0-android/android-arm64/publish -maxdepth 1 -name '*-Signed.apk' -print -quit)
          test -n "$signed"
          cp "$signed" release-assets/VoiceCraft-Server-Mobile-VoiceRange-StrongFade50-arm64-Signed.apk

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Endstone 0.2.8 and Item Mic 2.3.0
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install build pillow
          python -m compileall -q VoiceCraft.Endstone/src tools/apply_voice_range_patch.py tools/validate_voice_range_fade.py tools/build_item_mic_voice_range_addon.py
          (cd VoiceCraft.Endstone && python -m build --wheel)
          wheel=$(find VoiceCraft.Endstone/dist -maxdepth 1 -name 'endstone_voicecraft-0.2.8-*.whl' -print -quit)
          test -n "$wheel"
          cp "$wheel" release-assets/endstone_voicecraft-0.2.8-py3-none-any.whl
          python tools/build_item_mic_voice_range_addon.py . release-assets/VoiceCraft_ItemMic_v2.3.0.mcaddon
          test -s release-assets/VoiceCraft_ItemMic_v2.3.0.mcaddon

      - name: Validate canonical Endstone wheel and Item Mic addon
        shell: bash
        run: |
          set -euo pipefail
          wheel="release-assets/endstone_voicecraft-0.2.8-py3-none-any.whl"
          python - "$wheel" <<'PY'
          import pathlib, sys, zipfile
          wheel = pathlib.Path(sys.argv[1])
          if wheel.name != "endstone_voicecraft-0.2.8-py3-none-any.whl":
              raise SystemExit(wheel.name)
          with zipfile.ZipFile(wheel) as z:
              metadata = z.read("endstone_voicecraft-0.2.8.dist-info/METADATA").decode()
              entry = z.read("endstone_voicecraft-0.2.8.dist-info/entry_points.txt").decode()
              assert "Name: endstone-voicecraft\n" in metadata
              assert "Version: 0.2.8\n" in metadata
              assert "voicecraft = endstone_voicecraft:VoiceCraftEndstone" in entry
          PY
          rm -rf wheel-install-check itemmic-check
          python -m pip install --no-deps --target wheel-install-check "$wheel"
          PYTHONPATH=wheel-install-check python - <<'PY'
          import importlib.metadata
          d = importlib.metadata.distribution("endstone-voicecraft")
          assert d.version == "0.2.8"
          PY
          mkdir -p itemmic-check/bp itemmic-check/rp
          unzip -q release-assets/VoiceCraft_ItemMic_v2.3.0.mcaddon -d itemmic-check
          test -s itemmic-check/VoiceCraft_ItemMic_BP_v2.3.0.mcpack
          test -s itemmic-check/VoiceCraft_ItemMic_RP_v2.3.0.mcpack
          unzip -q itemmic-check/VoiceCraft_ItemMic_BP_v2.3.0.mcpack -d itemmic-check/bp
          unzip -q itemmic-check/VoiceCraft_ItemMic_RP_v2.3.0.mcpack -d itemmic-check/rp
          grep -q 'PlayerPermissionLevel.Operator' itemmic-check/bp/scripts/main.js
          grep -q 'voicecraft.vr.request.' itemmic-check/bp/scripts/main.js
          grep -q 'ตั้งค่าระยะเสียง' itemmic-check/bp/scripts/main.js

      - name: Validate Relay 0.2.1
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Relay syntax check
        shell: bash
        working-directory: VoiceCraft.Bridge.Relay
        run: |
          npm install --omit=dev
          npm run check

      - name: Build GPL and corresponding source assets
        shell: bash
        run: |
          set -euo pipefail
          cp VoiceCraft.Upstream/LICENSE.md release-assets/GPL-3.0.txt
          cp NOTICE.md release-assets/NOTICE.md
          source_name="VoiceCraft-Server-Mobile-${RELEASE_TAG}-Corresponding-Source"
          mkdir -p "release-source/${source_name}"
          rsync -a --exclude='.git' --exclude='release-assets' --exclude='release-source' ./ "release-source/${source_name}/"
          find "release-source/${source_name}" -depth -type d \( -name bin -o -name obj -o -name node_modules -o -name dist -o -name __pycache__ \) -exec rm -rf {} +
          find "release-source/${source_name}" -name '.git' -delete
          find "release-source/${source_name}" -name '*.pyc' -delete
          cat > "release-source/${source_name}/SOURCE_INFO.txt" <<EOF
          VoiceCraft Server Mobile Corresponding Source
          Release tag: ${RELEASE_TAG}
          Release commit: ${GITHUB_SHA}
          Android: 1.7.1-android-phase2-ui5-voice-range (version code 14)
          Voice Range: default 20 blocks, admin max 150 blocks, Operator bypass
          Distance Fade: full volume through 50%, nonlinear power 1.5 fade to 0% at 100%
          Endstone: 0.2.8
          Item Mic addon: 2.3.0
          Relay: 0.2.1
          VoiceCraft upstream: v1.7.1
          Upstream commit: 85aaccccbb58adb23e8c87144e8b1c24bf4b2011
          Upstream: https://github.com/AvionBlock/VoiceCraft
          EOF
          (cd release-source && zip -qr "../release-assets/${source_name}.zip" "${source_name}")

      - name: Create checksums and release notes
        shell: bash
        run: |
          set -euo pipefail
          (cd release-assets && sha256sum VoiceCraft-Server-Mobile-VoiceRange-StrongFade50-arm64-Signed.apk endstone_voicecraft-0.2.8-py3-none-any.whl VoiceCraft_ItemMic_v2.3.0.mcaddon GPL-3.0.txt NOTICE.md *-Corresponding-Source.zip > SHA256SUMS.txt)
          cat > release-notes.md <<'EOF'
          ## VoiceCraft Server Mobile — Voice Range + StrongFade50

          This release promotes the tested Voice Range system and stronger distance attenuation to `main`.

          ### Voice Range
          - Per-speaker outgoing microphone range controlled from the existing Item Mic settings.
          - Quick presets: 5 / 10 / 20 blocks plus a custom distance input.
          - Default player range: 20 blocks.
          - Default server maximum: 150 blocks.
          - Operators can exceed the configured server maximum.
          - Endstone is authoritative and validates player range requests server-side.
          - `/vc` command registration is restored reliably on the final plugin entry point.
          - `/vc` adds Operator-only Admin Settings for Maximum Voice Range.

          ### StrongFade50 distance attenuation
          - Audio stays at full volume through the first 50% of the speaker's selected range.
          - From 50% to 100%, VoiceCraft uses a nonlinear power-1.5 fade for clearer distance falloff.
          - Example at 10 blocks: 0–5 = 100%, 6 ≈ 72%, 7 ≈ 46%, 8 ≈ 25%, 9 ≈ 9%, 10 = 0%.
          - MinRange and MaxRange are speaker-only, so listener settings cannot alter another player's outgoing range.
          - Existing SampleLerpVolume smoothing remains enabled to avoid abrupt volume jumps.
          - No audio decode/re-encode is added and microphone audio still does not pass through Render.

          ### Components
          - Android display version: `1.7.1-android-phase2-ui5-voice-range`
          - Android version code: `14`
          - Endstone: `0.2.8`
          - Item Mic: `2.3.0`
          - Relay: `0.2.1`
          - VoiceCraft upstream: `v1.7.1` / `85aaccccbb58adb23e8c87144e8b1c24bf4b2011`

          ### Existing systems preserved
          - UI5 and Render API provisioning.
          - Primary + Backup Render relay failover and Minecraft status messages.
          - Account V2 / Free / Premium / Admin gating.
          - Item Mic Hold-to-Talk, Toggle and offhand behavior.
          - Normal mute, server mute and Item Mic mute gates.

          The Endstone wheel uses its canonical filename and distribution metadata and is installation-tested in CI before release.
          EOF

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes-file release-notes.md
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --notes-file release-notes.md
          fi
