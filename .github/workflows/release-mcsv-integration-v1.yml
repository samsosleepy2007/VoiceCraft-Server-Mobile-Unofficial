name: Release MCSV Endweave V3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-mcsv-integration-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      TAG: v1.7.1-android-phase2-ui5-mcsv-v3-endweave-resolver-endstone0.2.8-relay0.2.1-itemmic2.4.0
      RELEASE_NAME: VoiceCraft Server Mobile MCSV Endweave V3
      APP_DISPLAY_VERSION: 1.7.1-android-phase2-ui5-mcsv-v3-endweave
      APP_VERSION_CODE: "20"
      APK_NAME: VoiceCraft-Server-Mobile-MCSV-V3-Endweave-arm64-Signed.apk
      PLUGIN_NAME: endstone_voicecraft-0.2.8-py3-none-any.whl
      ADDON_NAME: VoiceCraft_ItemMic_v2.4.0.mcaddon
      ENDWEAVE_NAME: endstone_endweave-0.5.1-cp312-abi3-manylinux_2_28_x86_64.whl
      EXPECTED_ENDWEAVE_SHA256: 3eac84543faaee7bc658a301b1a8ed8b4c147e4eb594065c6e278bbb47596a6c
      KEEP_TEST_BRANCH: mcsv-endweave-v2

    steps:
      - name: Checkout merged main and VoiceCraft v1.7.1 submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify release is built from main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git -C VoiceCraft.Upstream rev-parse HEAD)" = "85aaccccbb58adb23e8c87144e8b1c24bf4b2011"
          test -f LICENSE.md
          test -f NOTICE.md
          cmp -s LICENSE.md VoiceCraft.Upstream/LICENSE.md

      - name: Apply production runtime patches and MCSV V3 resolver
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply_phase1.py VoiceCraft.Upstream
          python tools/apply_android_console_fix.py VoiceCraft.Upstream
          python tools/apply_android_tcp_mchttp.py VoiceCraft.Upstream
          python tools/apply_bridge_runtime.py VoiceCraft.Upstream
          python tools/apply_render_api_core.py .
          python VoiceCraft.Guest.Patch/apply_guest_account_patch.py .
          python tools/apply_item_mic_bridge_patch.py .
          python tools/apply_voice_range_patch.py .
          python VoiceCraft.Guest.Patch/apply_legal_compliance_patch.py .
          python tools/apply_mcsv_integration.py .
          python tools/apply_mcsv_theme_guide_fix.py .
          python tools/apply_mcsv_endweave_v2.py .
          python tools/apply_mcsv_endweave_v2_ui.py .

      - name: Set MCSV V3 production Android identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os, re

          display = os.environ["APP_DISPLAY_VERSION"]
          code = os.environ["APP_VERSION_CODE"]
          csproj = Path("VoiceCraft.Server.Android/VoiceCraft.Server.Android.csproj")
          text = csproj.read_text(encoding="utf-8")
          text, n1 = re.subn(r"<ApplicationVersion>\d+</ApplicationVersion>", f"<ApplicationVersion>{code}</ApplicationVersion>", text, count=1)
          text, n2 = re.subn(r"<ApplicationDisplayVersion>[^<]+</ApplicationDisplayVersion>", f"<ApplicationDisplayVersion>{display}</ApplicationDisplayVersion>", text, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit("Could not set MCSV V3 Android identity")
          csproj.write_text(text, encoding="utf-8")

          bridge = Path("VoiceCraft.Server.Android/EndstoneBridgeController.cs")
          text = bridge.read_text(encoding="utf-8")
          text, n = re.subn(r'appVersion = "[^"]+"', f'appVersion = "{display}"', text, count=1)
          if n != 1:
              raise SystemExit("Could not set MCSV V3 bridge appVersion")
          bridge.write_text(text, encoding="utf-8")
          PY

      - name: Validate MCSV V3 release guards
        shell: bash
        run: |
          set -euo pipefail
          test -f VoiceCraft.Server.Android/McsvEndweaveReleaseClient.cs
          test -f VoiceCraft.Server.Android/McsvEndweaveCompatibility.cs
          test -f VoiceCraft.Server.Android/McsvEndweaveResolver.cs
          grep -q 'https://api.github.com/repos/EndstoneMC/endweave/releases' VoiceCraft.Server.Android/McsvEndweaveReleaseClient.cs
          grep -q '/EndstoneMC/endweave/releases/download/' VoiceCraft.Server.Android/McsvEndweaveResolver.cs
          grep -q 'DIGEST PASS' VoiceCraft.Server.Android/McsvEndweaveResolver.cs
          grep -q 'DIGEST FAIL' VoiceCraft.Server.Android/McsvEndweaveResolver.cs
          grep -q 'trying older official release' VoiceCraft.Server.Android/McsvEndweaveResolver.cs
          grep -q 'last-known-good' VoiceCraft.Server.Android/McsvEndweaveResolver.cs
          grep -q '50L \* 1024L \* 1024L' VoiceCraft.Server.Android/McsvEndweaveResolver.cs
          grep -q 'McsvEndweaveResolver.ResolveAsync' VoiceCraft.Server.Android/McsvVoiceCraftInstaller.cs
          grep -q 'voicecraft-endweave-v2-preinstall' VoiceCraft.Server.Android/McsvVoiceCraftInstaller.cs
          grep -q 'McsvInstallVerifier.VerifyItemMicFilesAsync' VoiceCraft.Server.Android/McsvVoiceCraftInstaller.cs
          grep -q 'McsvStartupVerifier.VerifyAsync' VoiceCraft.Server.Android/McsvVoiceCraftInstaller.cs
          grep -q 'Ready — Endweave + VoiceCraft online' VoiceCraft.Server.Android/McsvVoiceCraftInstaller.cs
          grep -q 'version = "0.2.8"' VoiceCraft.Endstone/pyproject.toml
          grep -q '<ApplicationVersion>20</ApplicationVersion>' VoiceCraft.Server.Android/VoiceCraft.Server.Android.csproj
          grep -q '<ApplicationDisplayVersion>1.7.1-android-phase2-ui5-mcsv-v3-endweave</ApplicationDisplayVersion>' VoiceCraft.Server.Android/VoiceCraft.Server.Android.csproj

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install .NET Android workload
        run: dotnet workload install android

      - name: Build latest VoiceCraft Android ARM64 APK from main
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore VoiceCraft.Server.Android/VoiceCraft.Server.Android.csproj
          dotnet build VoiceCraft.Server.Android/VoiceCraft.Server.Android.csproj -c Release --no-restore
          dotnet publish VoiceCraft.Server.Android/VoiceCraft.Server.Android.csproj -c Release -r android-arm64 --no-restore
          mkdir -p release-assets
          signed=$(find VoiceCraft.Server.Android/bin/Release/net10.0-android/android-arm64/publish -maxdepth 1 -name '*-Signed.apk' -print -quit)
          test -n "$signed"
          cp "$signed" "release-assets/$APK_NAME"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Endstone plugin 0.2.8 and Item Mic addon 2.4.0 from main
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install build pillow
          python -m compileall -q VoiceCraft.Endstone/src VoiceCraft.Endstone/tests tools/build_item_mic_addon.py tools/build_item_mic_voice_range_addon.py tools/build_item_mic_v2_4_addon.py
          (cd VoiceCraft.Endstone && python -m build --wheel)
          wheel=$(find VoiceCraft.Endstone/dist -maxdepth 1 -name 'endstone_voicecraft-0.2.8-*.whl' -print -quit)
          test -n "$wheel"
          cp "$wheel" "release-assets/$PLUGIN_NAME"
          python tools/build_item_mic_v2_4_addon.py . "release-assets/$ADDON_NAME"
          test -s "release-assets/$ADDON_NAME"

      - name: Validate Item Mic 2.4 addon package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf itemmic-check
          mkdir itemmic-check
          unzip -q "release-assets/$ADDON_NAME" -d itemmic-check
          test -s itemmic-check/VoiceCraft_ItemMic_BP_v2.4.0.mcpack
          test -s itemmic-check/VoiceCraft_ItemMic_RP_v2.4.0.mcpack
          mkdir itemmic-check/bp itemmic-check/rp
          unzip -q itemmic-check/VoiceCraft_ItemMic_BP_v2.4.0.mcpack -d itemmic-check/bp
          unzip -q itemmic-check/VoiceCraft_ItemMic_RP_v2.4.0.mcpack -d itemmic-check/rp
          grep -q 'VoiceCraft Item Mic BP v2.4' itemmic-check/bp/manifest.json
          grep -q 'VoiceCraft Mic Icons RP v2.4' itemmic-check/rp/manifest.json
          grep -q 'MIC_DUPLICATE_REMOVED' itemmic-check/bp/scripts/main.js
          grep -q 'Loaded v2.4.0' itemmic-check/bp/scripts/main.js

      - name: Fetch verified official Endweave manual wheel
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            "https://github.com/EndstoneMC/endweave/releases/download/v0.5.1/$ENDWEAVE_NAME" \
            -o "release-assets/$ENDWEAVE_NAME"
          echo "$EXPECTED_ENDWEAVE_SHA256  release-assets/$ENDWEAVE_NAME" | sha256sum -c -

      - name: Generate release checksums and notes
        shell: bash
        run: |
          set -euo pipefail
          (
            cd release-assets
            sha256sum "$APK_NAME" "$PLUGIN_NAME" "$ADDON_NAME" "$ENDWEAVE_NAME" > SHA256SUMS.txt
          )
          cat > release-notes.md <<'EOF'
          ## VoiceCraft Server Mobile — MCSV Endweave V3

          This release promotes the latest tested MCSV/Endweave resolver work to `main` and publishes a self-contained VoiceCraft server package.

          ### Included files
          - **VoiceCraft Android APK** — `VoiceCraft-Server-Mobile-MCSV-V3-Endweave-arm64-Signed.apk`
          - **VoiceCraft Endstone Plugin 0.2.8** — `endstone_voicecraft-0.2.8-py3-none-any.whl`
          - **VoiceCraft Item Mic Addon 2.4.0** — `VoiceCraft_ItemMic_v2.4.0.mcaddon`
          - **Endweave 0.5.1 Linux x86_64 manual wheel** — `endstone_endweave-0.5.1-cp312-abi3-manylinux_2_28_x86_64.whl`
          - **SHA-256 checksums** — `SHA256SUMS.txt`

          ### MCSV V3 resolver hardening
          - Queries stable releases from the official `EndstoneMC/endweave` GitHub Releases API.
          - Automatically evaluates `requires-python`, Endstone dependency compatibility, OS, CPU, CPython and ABI/ABI3 wheel tags.
          - Accepts only HTTPS assets from the official EndstoneMC Endweave release path.
          - Requires and validates the GitHub SHA-256 digest for dynamic official candidates.
          - Streams downloaded wheel bytes and independently verifies SHA-256, Content-Length, byte count and a 50 MiB safety ceiling before installation.
          - If the newest compatible official release fails integrity/download validation, the resolver tries older compatible official stable releases.
          - Uses the verified last-known-good catalog only after official candidates are exhausted or unavailable.
          - A fallback wheel is SHA-256 verified again before it can be installed.

          ### Detailed runtime logs
          - Resolver/install stages are classified as `STEP`, `OK`, `WARN`, `ERROR` and `READY`.
          - Integrity events include `DIGEST PASS`, `DIGEST FAIL`, incompatible-release skip reasons, older-official fallback and last-known-good fallback.
          - Known SHA/digest/size failures produce a targeted help hint.
          - MCSV tokens, Bearer credentials and secret/token assignments are redacted from runtime logs.

          ### Safe MCSV installation flow
          - Detect Endstone runtime / OS / Python / CPU.
          - Validate Python package metadata before modification.
          - Require a pre-install safety backup.
          - Resolve and verify Endweave before install.
          - Install VoiceCraft Endstone plugin 0.2.8.
          - Install and verify Item Mic 2.4.0 BP/RP plus active-world pack JSON.
          - Write and verify VoiceCraft relay / Voice Range configuration.
          - Restart the server, wait for `Running`, then verify startup logs for Endweave + VoiceCraft before showing Ready.

          ### Production versions
          - VoiceCraft upstream: **v1.7.1** (`85aaccccbb58adb23e8c87144e8b1c24bf4b2011`)
          - Android: **1.7.1-android-phase2-ui5-mcsv-v3-endweave** / version code **20**
          - VoiceCraft Endstone plugin: **0.2.8**
          - Item Mic: **2.4.0 Hidden Single Mic**
          - Relay: **0.2.1 / protocol 1**
          - Voice Range + StrongFade50 preserved

          The attached Endweave wheel is provided for common Linux x86_64 manual installation. The Android app itself uses the V3 resolver to select the newest compatible verified official Endweave wheel for the detected MCSV server environment.
          EOF

      - name: Create or update latest GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=(
            "release-assets/$APK_NAME"
            "release-assets/$PLUGIN_NAME"
            "release-assets/$ADDON_NAME"
            "release-assets/$ENDWEAVE_NAME"
            "release-assets/SHA256SUMS.txt"
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --target "$GITHUB_SHA" --title "$RELEASE_NAME" --notes-file release-notes.md --latest
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --target "$GITHUB_SHA" --title "$RELEASE_NAME" --notes-file release-notes.md --latest
          fi

      - name: Verify new release contains required package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          names=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          grep -Fxq "$APK_NAME" <<<"$names"
          grep -Fxq "$PLUGIN_NAME" <<<"$names"
          grep -Fxq "$ADDON_NAME" <<<"$names"
          grep -Fxq "$ENDWEAVE_NAME" <<<"$names"
          grep -Fxq 'SHA256SUMS.txt' <<<"$names"

      - name: Remove all older GitHub Releases and their tags
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while IFS= read -r old_tag; do
            [ -z "$old_tag" ] && continue
            [ "$old_tag" = "$TAG" ] && continue
            echo "Removing old release and tag: $old_tag"
            gh release delete "$old_tag" --cleanup-tag -y
          done < <(gh release list --limit 100 --json tagName --jq '.[].tagName')

      - name: Remove legacy branches and keep only main plus latest tested branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while IFS= read -r branch; do
            [ -z "$branch" ] && continue
            [ "$branch" = "main" ] && continue
            [ "$branch" = "$KEEP_TEST_BRANCH" ] && continue
            encoded=$(jq -rn --arg value "$branch" '$value|@uri')
            echo "Deleting legacy branch: $branch"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded}"
          done < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name')

      - name: Final repository cleanup audit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_tags=$(gh release list --limit 100 --json tagName --jq '.[].tagName')
          test "$(grep -c . <<<"$release_tags")" -eq 1
          grep -Fxq "$TAG" <<<"$release_tags"

          branches=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name' | sort)
          printf '%s\n' "$branches"
          test "$(grep -c . <<<"$branches")" -eq 2
          grep -Fxq 'main' <<<"$branches"
          grep -Fxq "$KEEP_TEST_BRANCH" <<<"$branches"

      - name: Upload final release bundle as CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceCraft-MCSV-Endweave-V3-Complete-Release
          if-no-files-found: error
          path: release-assets/*
