name: Release VoiceCraft Bundle

on:
  workflow_dispatch:
  push:
    branches: [main, release-itemmic-0.2.7]
    paths:
      - "release-manifest.json"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository and VoiceCraft v1.7.1 submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read release manifest
        shell: bash
        run: |
          set -euo pipefail
          echo "RELEASE_TAG=$(jq -r '.tag' release-manifest.json)" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=$(jq -r '.title' release-manifest.json)" >> "$GITHUB_ENV"
          test "$(jq -r '.android.display_version' release-manifest.json)" = "1.7.1-android-phase2-ui4.5.2-account-v2-guest"
          test "$(jq -r '.android.version_code' release-manifest.json)" = "13"
          test "$(jq -r '.endstone' release-manifest.json)" = "0.2.7"
          test "$(jq -r '.relay' release-manifest.json)" = "0.2.1"
          test "$(jq -r '.protocol' release-manifest.json)" = "1"
          test "$(jq -r '.item_mic' release-manifest.json)" = "2.2.0"
          test "$(jq -r '.voicecraft_upstream_commit' release-manifest.json)" = "85aaccccbb58adb23e8c87144e8b1c24bf4b2011"

      - name: Verify pinned upstream version and GPL attribution
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C VoiceCraft.Upstream rev-parse HEAD)" = "85aaccccbb58adb23e8c87144e8b1c24bf4b2011"
          test -f LICENSE.md
          test -f NOTICE.md
          cmp -s LICENSE.md VoiceCraft.Upstream/LICENSE.md
          grep -q 'https://github.com/AvionBlock/VoiceCraft' NOTICE.md
          grep -q 'GPL-3.0' NOTICE.md

      - name: Apply Android headless runtime patch
        run: python tools/apply_phase1.py VoiceCraft.Upstream

      - name: Disable Spectre.Console for Android headless mode
        run: python tools/apply_android_console_fix.py VoiceCraft.Upstream

      - name: Replace HttpListener with Android TcpListener McHttp
        run: python tools/apply_android_tcp_mchttp.py VoiceCraft.Upstream

      - name: Add Endstone bridge runtime dispatcher
        run: python tools/apply_bridge_runtime.py VoiceCraft.Upstream

      - name: Apply Guest / Account V2 patch
        run: python VoiceCraft.Guest.Patch/apply_guest_account_patch.py .

      - name: Apply Item Mic bridge patch
        run: python tools/apply_item_mic_bridge_patch.py .

      - name: Apply Open Source / Legal patch
        run: python VoiceCraft.Guest.Patch/apply_legal_compliance_patch.py .

      - name: Validate release guards
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'MainLauncher = true' VoiceCraft.Server.Android/AccountGateActivity.cs
          ! grep -R --include='*.cs' -n 'MainLauncher = true' VoiceCraft.Server.Android | grep -v 'AccountGateActivity.cs'
          grep -q 'NoBackupFilesDir' VoiceCraft.Server.Android/KeystoreJsonStore.cs
          grep -q 'AndroidKeyStore' VoiceCraft.Server.Android/KeystoreJsonStore.cs
          grep -q 'AES/GCM/NoPadding' VoiceCraft.Server.Android/KeystoreJsonStore.cs
          grep -q 'android:allowBackup="false"' VoiceCraft.Server.Android/Properties/AndroidManifest.xml
          grep -q 'android:icon="@drawable/voicecraft_logo"' VoiceCraft.Server.Android/Properties/AndroidManifest.xml
          grep -q '<ApplicationVersion>13</ApplicationVersion>' VoiceCraft.Server.Android/VoiceCraft.Server.Android.csproj
          grep -q '1.7.1-android-phase2-ui4.5.2-account-v2-guest' VoiceCraft.Server.Android/VoiceCraft.Server.Android.csproj
          grep -q 'appVersion = "1.7.1-android-phase2-ui4.5.2-account-v2-guest"' VoiceCraft.Server.Android/EndstoneBridgeController.cs
          grep -q 'voicecraft-mobile' VoiceCraft.Server.Android/AccountApiConfig.cs
          ! grep -q 'voicecraft-account' VoiceCraft.Server.Android/AccountApiConfig.cs
          ! grep -Eiq 'admin|mfa|otp' VoiceCraft.Server.Android/VoiceCraftAccountClient.cs
          ! grep -Eiq 'admin|mfa|otp' VoiceCraft.Server.Android/RegisteredLoginActivity.cs
          ! grep -Eiq 'admin|mfa|otp' VoiceCraft.Server.Android/RegisteredSessionStore.cs
          grep -q 'MaxAttemptsPerRelay = 5' VoiceCraft.Server.Android/EndstoneBridgeController.cs
          grep -q 'PeerTimeoutSeconds = 30' VoiceCraft.Server.Android/EndstoneBridgeController.cs
          grep -q 'BackupRelayActivity' VoiceCraft.Server.Android/ModernMainActivity.cs
          grep -q 'case "unbind"' VoiceCraft.Server.Android/EndstoneBridgeController.cs
          grep -q 'type = "unbind_result"' VoiceCraft.Server.Android/EndstoneBridgeController.cs
          grep -q 'bool? MicOn' VoiceCraft.Server.Android/EndstoneBridgeController.cs
          grep -q 'voicecraft:item_mic_muted' VoiceCraft.Server.Android/EndstoneBridgeController.cs
          grep -q 'version = "0.2.7"' VoiceCraft.Endstone/src/endstone_voicecraft/item_mic.py
          grep -q 'message\["micOn"\] = mic_on' VoiceCraft.Endstone/src/endstone_voicecraft/item_mic.py
          grep -q 'from .item_mic import VoiceCraftEndstone' VoiceCraft.Endstone/src/endstone_voicecraft/__init__.py
          grep -q 'version = "0.2.7"' VoiceCraft.Endstone/pyproject.toml
          test -f tools/build_item_mic_addon.py
          grep -q 'RenderApiClient' VoiceCraft.Server.Android/ModernMainActivity.cs
          grep -q 'VoiceCraft by SamSoSleepy' VoiceCraft.Server.Android/ModernMainActivity.cs
          grep -q 'BACKUP RELAY • LOCKED' VoiceCraft.Server.Android/ModernMainActivity.cs
          grep -q 'FindServiceByNameAsync' VoiceCraft.Server.Android/RenderApiClient.cs

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install .NET Android workload
        run: dotnet workload install android

      - name: Restore, build and publish VoiceCraft Server ARM64 APK
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore VoiceCraft.Server.Android/VoiceCraft.Server.Android.csproj
          dotnet build VoiceCraft.Server.Android/VoiceCraft.Server.Android.csproj -c Release --no-restore
          dotnet publish VoiceCraft.Server.Android/VoiceCraft.Server.Android.csproj \
            -c Release \
            -r android-arm64 \
            --no-restore
          mkdir -p release-assets
          signed=$(find VoiceCraft.Server.Android/bin/Release/net10.0-android/android-arm64/publish -maxdepth 1 -name '*-Signed.apk' -print -quit)
          test -n "$signed"
          cp "$signed" release-assets/VoiceCraft-Server-Mobile-UI5-RenderAPI-arm64-Signed.apk

      - name: Scan APK for removed privileged-account client markers
        shell: bash
        run: |
          set -euo pipefail
          rm -rf apk-scan
          mkdir apk-scan
          unzip -q release-assets/VoiceCraft-Server-Mobile-UI5-RenderAPI-arm64-Signed.apk -d apk-scan
          if grep -R -a -E -i \
            'AdminMfaSetupRequired|adminMfaSetupRequired|/v1/admin|x-admin-otp|MFA_REQUIRED|ADMIN_REQUIRED|voicecraft-account' \
            apk-scan; then
            echo 'Removed privileged-account marker found inside APK.' >&2
            exit 1
          fi

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Endstone 0.2.7 and Item Mic 2.2.0 assets
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install build pillow
          python -m compileall -q VoiceCraft.Endstone/src VoiceCraft.Endstone/tests tools/build_item_mic_addon.py
          (cd VoiceCraft.Endstone && python -m build --wheel)
          wheel=$(find VoiceCraft.Endstone/dist -maxdepth 1 -name 'endstone_voicecraft-0.2.7-*.whl' -print -quit)
          test -n "$wheel"
          cp "$wheel" release-assets/endstone_voicecraft-0.2.7-py3-none-any.whl
          python tools/build_item_mic_addon.py . release-assets/VoiceCraft_ItemMic_v2.2.0.mcaddon
          test -s release-assets/VoiceCraft_ItemMic_v2.2.0.mcaddon

      - name: Validate Item Mic mcaddon
        shell: bash
        run: |
          set -euo pipefail
          rm -rf itemmic-check
          mkdir itemmic-check
          unzip -q release-assets/VoiceCraft_ItemMic_v2.2.0.mcaddon -d itemmic-check
          test -s itemmic-check/VoiceCraft_ItemMic_BP_v2.2.0.mcpack
          test -s itemmic-check/VoiceCraft_ItemMic_RP_v2.2.0.mcpack
          mkdir itemmic-check/bp itemmic-check/rp
          unzip -q itemmic-check/VoiceCraft_ItemMic_BP_v2.2.0.mcpack -d itemmic-check/bp
          unzip -q itemmic-check/VoiceCraft_ItemMic_RP_v2.2.0.mcpack -d itemmic-check/rp
          grep -q 'VoiceCraft Item Mic BP v2.2' itemmic-check/bp/manifest.json
          grep -q 'VoiceCraft Mic Icons RP v2.2' itemmic-check/rp/manifest.json
          test -s itemmic-check/bp/pack_icon.png
          test -s itemmic-check/rp/pack_icon.png
          grep -q 'voicecraft:mic_on' itemmic-check/bp/scripts/main.js
          grep -q 'voicecraft:mic_off' itemmic-check/bp/scripts/main.js

      - name: Validate Relay 0.2.1
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Relay syntax check
        shell: bash
        working-directory: VoiceCraft.Bridge.Relay
        run: |
          npm install --omit=dev
          npm run check

      - name: Build GPL and Corresponding Source release assets
        shell: bash
        run: |
          set -euo pipefail
          cp VoiceCraft.Upstream/LICENSE.md release-assets/GPL-3.0.txt
          cp NOTICE.md release-assets/NOTICE.md
          source_name="VoiceCraft-Server-Mobile-${RELEASE_TAG}-Corresponding-Source"
          mkdir -p "release-source/${source_name}"
          rsync -a \
            --exclude='.git' \
            --exclude='release-assets' \
            --exclude='release-source' \
            ./ "release-source/${source_name}/"
          find "release-source/${source_name}" -depth -type d \
            \( -name bin -o -name obj -o -name node_modules -o -name dist -o -name __pycache__ \) \
            -exec rm -rf {} +
          find "release-source/${source_name}" -name '.git' -delete
          find "release-source/${source_name}" -name '*.pyc' -delete
          cat > "release-source/${source_name}/SOURCE_INFO.txt" <<EOF
          VoiceCraft Server Mobile Corresponding Source
          Release tag: ${RELEASE_TAG}
          Release commit: ${GITHUB_SHA}
          Android: 1.7.1-android-phase2-ui4.5.2-account-v2-guest (version code 13)
          UI release: UI5 + Render API provisioning
          Endstone: 0.2.7
          Item Mic addon: 2.2.0
          Relay: 0.2.1
          VoiceCraft upstream: v1.7.1
          Upstream commit: 85aaccccbb58adb23e8c87144e8b1c24bf4b2011
          Upstream: https://github.com/AvionBlock/VoiceCraft
          EOF
          (cd release-source && zip -qr "../release-assets/${source_name}.zip" "${source_name}")
          test -s "release-assets/${source_name}.zip"

      - name: Create checksums and release notes
        shell: bash
        run: |
          set -euo pipefail
          (
            cd release-assets
            sha256sum \
              VoiceCraft-Server-Mobile-UI5-RenderAPI-arm64-Signed.apk \
              endstone_voicecraft-0.2.7-py3-none-any.whl \
              VoiceCraft_ItemMic_v2.2.0.mcaddon \
              GPL-3.0.txt \
              NOTICE.md \
              *-Corresponding-Source.zip \
              > SHA256SUMS.txt
          )
          cat > release-notes.md <<'EOF'
          ## VoiceCraft Server Mobile UI5 + Render API Provisioning

          This release promotes the tested UI5 redesign and the new in-app Render Relay provisioning flow to `main`.

          ### New: Render API provisioning
          - Create a VoiceCraft Render Web Service directly from the Android app with a temporary Render API key.
          - The API key is session-only: it is not saved to preferences, copied with setup data, or intentionally written to Runtime Logs.
          - The app automatically selects an accessible Render workspace.
          - Service configuration is fixed to `VoiceCraft by SamSoSleepy`, Singapore region and the Render Free plan.
          - Relay runtime is pinned to Node.js with `VoiceCraft.Bridge.Relay`, `npm install --omit=dev`, `npm start`, `/health` and `BRIDGE_SECRET`.
          - A missing/short Bridge Secret is generated automatically.
          - Deploy status is followed until LIVE/failed/timeout.
          - A LIVE `https://...onrender.com` URL is converted automatically to `wss://...onrender.com/bridge`.

          ### Primary / Backup Relay management
          - After connecting Render, choose whether the new service is for Primary or Backup Relay.
          - Free VoiceCraft accounts can use Primary only; Backup is locked unless the account entitlement allows `backupRelays`.
          - Premium/Admin-capable accounts can provision Backup Relay.
          - Existing Primary or Backup configuration is replaced only after the new Render service becomes LIVE.
          - Failed or timed-out deployments keep the current working Relay unchanged.

          ### Duplicate protection
          - The app checks the connected Render account for an existing `VoiceCraft by SamSoSleepy` service before creating another one.
          - Duplicate automatic provisioning is blocked and the user is instructed to use another Render account with a new API key when another Relay is required.

          ### UI5 redesign
          - Refreshed Server Dashboard, Server Setup, Runtime Logs and App Settings for mobile.
          - Dashboard identity now uses the SamSoSleepy GitHub profile avatar with an offline `SS` fallback.
          - Manual Render URL setup remains available alongside the automated Render API flow.
          - Render provisioning state and Relay controls are integrated into Server Setup.

          ### Runtime logs and McHttp
          - Semantic Runtime Log colors: success/online states are green, warnings/reconnect/failover are amber, errors are red and normal informational output is neutral.
          - Expected unauthenticated McHttp probe responses such as `HTTP/1.1 403 Forbidden` remain neutral because they still prove that McHttp is responding.
          - Actual Relay/Bridge authentication failures remain errors.

          ### Existing functionality preserved
          - Primary + Backup Render relay failover and in-game failover status messages.
          - Endstone VoiceCraft `0.2.7` and Item Mic `2.2.0` integration.
          - Item Mic remains an additional audio gate and cannot bypass normal/admin mute state.
          - Real `/vc` bind/unbind and automatic rebind handling.
          - Device-local Free Account plus registered accounts.
          - Premium/Admin gating for Backup Render Relay.
          - Foreground service, wake lock and unrestricted-battery request support.
          - Open Source & Legal attribution and corresponding source archive.

          ### Versions
          - VoiceCraft Android internal display version: `1.7.1-android-phase2-ui4.5.2-account-v2-guest` (version code `13`)
          - UI release generation: `UI5 + Render API provisioning`
          - Endstone VoiceCraft: `0.2.7`
          - VoiceCraft Item Mic addon: `2.2.0`
          - Render Relay: `0.2.1`
          - Bridge protocol: `1`
          - VoiceCraft upstream: `v1.7.1`

          ### Assets
          - `VoiceCraft-Server-Mobile-UI5-RenderAPI-arm64-Signed.apk`
          - `endstone_voicecraft-0.2.7-py3-none-any.whl`
          - `VoiceCraft_ItemMic_v2.2.0.mcaddon`
          - `VoiceCraft-Server-Mobile-...-Corresponding-Source.zip`
          - `GPL-3.0.txt`
          - `NOTICE.md`
          - `SHA256SUMS.txt`

          Older GitHub Releases are removed after this release is published so vulnerable builds are not offered as downloadable releases.
          EOF

      - name: Upload branch release-candidate assets
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: VoiceCraft-Release-Candidate-UI5-RenderAPI
          if-no-files-found: error
          path: |
            release-assets/VoiceCraft-Server-Mobile-UI5-RenderAPI-arm64-Signed.apk
            release-assets/endstone_voicecraft-0.2.7-py3-none-any.whl
            release-assets/VoiceCraft_ItemMic_v2.2.0.mcaddon
            release-assets/SHA256SUMS.txt

      - name: Create or update GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" \
              release-assets/* \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md \
              --latest
          fi

      - name: Remove older vulnerable GitHub Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r old_tag; do
            [ -z "$old_tag" ] && continue
            [ "$old_tag" = "$RELEASE_TAG" ] && continue
            echo "Removing old release: $old_tag"
            gh release delete "$old_tag" --cleanup-tag -y
          done < <(gh release list --limit 100 --json tagName --jq '.[].tagName')
