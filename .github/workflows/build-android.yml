name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "VoiceCraft.Upstream"
      - "VoiceCraft.Server.Android/**"
      - "VoiceCraft.Endstone/**"
      - "VoiceCraft.Guest.Patch/**"
      - "supabase/functions/voicecraft-mobile/**"
      - "LICENSE.md"
      - "NOTICE.md"
      - "tools/apply_phase1.py"
      - "tools/apply_android_console_fix.py"
      - "tools/apply_android_tcp_mchttp.py"
      - "tools/apply_bridge_runtime.py"
      - "tools/apply_render_api_core.py"
      - "tools/apply_item_mic_bridge_patch.py"
      - "tools/apply_voice_range_patch.py"
      - "tools/apply_mcsv_integration.py"
      - "tools/apply_mcsv_theme_guide_fix.py"
      - "tools/apply_mcsv_endweave_v2.py"
      - "tools/apply_mcsv_endweave_v2_ui.py"
      - "tools/apply_release_channel_v3_hotfix.py"
      - "tools/apply_release_channel_v3_0_2.py"
      - "release-manifest.json"
      - ".github/workflows/build-android.yml"
      - ".gitmodules"
  pull_request:
    branches: [main]
    paths:
      - "VoiceCraft.Upstream"
      - "VoiceCraft.Server.Android/**"
      - "VoiceCraft.Endstone/**"
      - "VoiceCraft.Guest.Patch/**"
      - "supabase/functions/voicecraft-mobile/**"
      - "LICENSE.md"
      - "NOTICE.md"
      - "tools/apply_phase1.py"
      - "tools/apply_android_console_fix.py"
      - "tools/apply_android_tcp_mchttp.py"
      - "tools/apply_bridge_runtime.py"
      - "tools/apply_render_api_core.py"
      - "tools/apply_item_mic_bridge_patch.py"
      - "tools/apply_voice_range_patch.py"
      - "tools/apply_mcsv_integration.py"
      - "tools/apply_mcsv_theme_guide_fix.py"
      - "tools/apply_mcsv_endweave_v2.py"
      - "tools/apply_mcsv_endweave_v2_ui.py"
      - "tools/apply_release_channel_v3_hotfix.py"
      - "tools/apply_release_channel_v3_0_2.py"
      - "release-manifest.json"
      - ".github/workflows/build-android.yml"
      - ".gitmodules"

jobs:
  build-android-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository and VoiceCraft v1.7.1 submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify pinned upstream version
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C VoiceCraft.Upstream rev-parse HEAD)" = "85aaccccbb58adb23e8c87144e8b1c24bf4b2011"
          test -f LICENSE.md
          test -f NOTICE.md
          cmp -s LICENSE.md VoiceCraft.Upstream/LICENSE.md

      - name: Apply production runtime patches
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply_phase1.py VoiceCraft.Upstream
          python tools/apply_android_console_fix.py VoiceCraft.Upstream
          python tools/apply_android_tcp_mchttp.py VoiceCraft.Upstream
          python tools/apply_bridge_runtime.py VoiceCraft.Upstream
          python tools/apply_render_api_core.py .
          python VoiceCraft.Guest.Patch/apply_guest_account_patch.py .
          python tools/apply_item_mic_bridge_patch.py .
          python tools/apply_voice_range_patch.py .
          python VoiceCraft.Guest.Patch/apply_legal_compliance_patch.py .
          python tools/apply_mcsv_integration.py .
          python tools/apply_mcsv_theme_guide_fix.py .
          python tools/apply_mcsv_endweave_v2.py .
          python tools/apply_mcsv_endweave_v2_ui.py .
          python tools/apply_release_channel_v3_hotfix.py .
          python tools/apply_release_channel_v3_0_2.py .

      - name: Set MCSV V3.0.2 Android identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          display = "1.7.1-android-phase2-ui5-mcsv-v3.0.2-endweave"
          csproj = Path("VoiceCraft.Server.Android/VoiceCraft.Server.Android.csproj")
          text = csproj.read_text(encoding="utf-8")
          text, n1 = re.subn(r"<ApplicationVersion>\d+</ApplicationVersion>", "<ApplicationVersion>22</ApplicationVersion>", text, count=1)
          text, n2 = re.subn(r"<ApplicationDisplayVersion>[^<]+</ApplicationDisplayVersion>", f"<ApplicationDisplayVersion>{display}</ApplicationDisplayVersion>", text, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit("Could not set MCSV V3.0.2 Android identity")
          csproj.write_text(text, encoding="utf-8")

          bridge = Path("VoiceCraft.Server.Android/EndstoneBridgeController.cs")
          text = bridge.read_text(encoding="utf-8")
          text, n = re.subn(r'appVersion = "[^"]+"', f'appVersion = "{display}"', text, count=1)
          if n != 1:
              raise SystemExit("Could not set MCSV V3.0.2 bridge appVersion")
          bridge.write_text(text, encoding="utf-8")
          PY

      - name: Validate production integration guards
        shell: bash
        run: |
          set -euo pipefail
          check() { echo "[guard] $1"; shift; "$@"; }
          check "MCSV patch scripts compile" python -m compileall -q tools/apply_mcsv_integration.py tools/apply_mcsv_theme_guide_fix.py tools/apply_mcsv_endweave_v2.py tools/apply_mcsv_endweave_v2_ui.py tools/apply_release_channel_v3_hotfix.py tools/apply_release_channel_v3_0_2.py
          check "current release manifest protocol 1" grep -Fq '"protocol": 1' release-manifest.json
          check "current release manifest version 21" grep -Fq '"version_code": 22' release-manifest.json
          check "current release manifest V3.0.1" grep -Fq '1.7.1-android-phase2-ui5-mcsv-v3.0.2-endweave' release-manifest.json
          check "MCSV API client" test -f VoiceCraft.Server.Android/McsvApiClient.cs
          check "MCSV installer" test -f VoiceCraft.Server.Android/McsvVoiceCraftInstaller.cs
          check "Endweave runtime detector" test -f VoiceCraft.Server.Android/McsvEndweaveSupport.cs
          check "Endweave release client" test -f VoiceCraft.Server.Android/McsvEndweaveReleaseClient.cs
          check "Endweave compatibility" test -f VoiceCraft.Server.Android/McsvEndweaveCompatibility.cs
          check "Endweave resolver" test -f VoiceCraft.Server.Android/McsvEndweaveResolver.cs
          check "Python environment validator" test -f VoiceCraft.Server.Android/McsvPythonEnvironmentValidator.cs
          check "Endweave installer helper" test -f VoiceCraft.Server.Android/McsvEndweaveInstaller.cs
          check "post-install verifier" test -f VoiceCraft.Server.Android/McsvInstallVerifier.cs
          check "startup verifier" test -f VoiceCraft.Server.Android/McsvStartupVerifier.cs
          check "MCSV token protected" grep -q 'KeystoreJsonStore' VoiceCraft.Server.Android/McsvTokenStore.cs
          check "MCSV fixed API host" grep -q 'https://api.mcsv.me/api/v1/' VoiceCraft.Server.Android/McsvApiClient.cs
          check "MCSV redirects blocked" grep -q 'AllowAutoRedirect = false' VoiceCraft.Server.Android/McsvApiClient.cs
          check "official Endweave release API" grep -Fq 'api.github.com/repos/EndstoneMC/endweave/releases' VoiceCraft.Server.Android/McsvEndweaveReleaseClient.cs
          check "V3 resolver wired" grep -Fq 'McsvEndweaveResolver.ResolveAsync' VoiceCraft.Server.Android/McsvVoiceCraftInstaller.cs
          check "official digest PASS log" grep -Fq 'DIGEST PASS' VoiceCraft.Server.Android/McsvEndweaveResolver.cs
          check "official digest FAIL log" grep -Fq 'DIGEST FAIL' VoiceCraft.Server.Android/McsvEndweaveResolver.cs
          check "older official fallback" grep -Fq 'trying older official release' VoiceCraft.Server.Android/McsvEndweaveResolver.cs
          check "last-known-good fallback" grep -Fq 'last-known-good' VoiceCraft.Server.Android/McsvEndweaveResolver.cs
          check "mandatory safety backup" grep -q 'voicecraft-endweave-v2-preinstall' VoiceCraft.Server.Android/McsvVoiceCraftInstaller.cs
          check "Endweave flow" grep -q 'McsvEndweaveInstaller.InstallAsync' VoiceCraft.Server.Android/McsvVoiceCraftInstaller.cs
          check "Item Mic verification" grep -q 'McsvInstallVerifier.VerifyItemMicFilesAsync' VoiceCraft.Server.Android/McsvVoiceCraftInstaller.cs
          check "config/world verification" grep -q 'McsvInstallVerifier.VerifyConfigAndActiveWorldAsync' VoiceCraft.Server.Android/McsvVoiceCraftInstaller.cs
          check "startup logs verification" grep -q 'McsvStartupVerifier.VerifyAsync' VoiceCraft.Server.Android/McsvVoiceCraftInstaller.cs
          check "Ready gate" grep -q 'Ready — Endweave + VoiceCraft online' VoiceCraft.Server.Android/McsvVoiceCraftInstaller.cs
          check "latest release channel in MCSV installer" grep -Fq 'releases/latest/download/' VoiceCraft.Server.Android/McsvVoiceCraftInstaller.cs
          check "latest release channel in configured plugin downloader" grep -Fq 'releases/latest/download/' VoiceCraft.Server.Android/ConfiguredPluginDownloadInjector.cs
          check "configured plugin uses 0.2.17" grep -Fq 'endstone_voicecraft-0.2.17-py3-none-any.whl' VoiceCraft.Server.Android/ConfiguredPluginDownloadInjector.cs
          check "configured plugin verifies 0.2.17 SHA" grep -Fq '4d8895fa653a6c01f0d935f648be7b4e94357999663c5358a0280f55a99f9e1c' VoiceCraft.Server.Android/ConfiguredPluginDownloadInjector.cs
          check "deleted Item Mic tag absent" bash -c '! grep -R -Fq "v1.7.1-itemmic2.4.0-hidden-single" VoiceCraft.Server.Android'
          check "deleted Voice Range release tag absent" bash -c '! grep -R -Fq "v1.7.1-android-phase2-ui5-voice-range-strongfade50-endstone0.2.8-relay0.2.1-itemmic2.3.0" VoiceCraft.Server.Android'
          check "deleted 0.2.6 release tag absent" bash -c '! grep -R -Fq "v1.7.1-android-phase2-ui4.5.2-account-v2-guest-endstone0.2.6-relay0.2.1" VoiceCraft.Server.Android'
          check "automatic server restart" grep -q 'action = "restart"' VoiceCraft.Server.Android/McsvVoiceCraftInstaller.cs
          check "voice range fade start" grep -q 'VoiceRangeFadeStartRatio = 0.50f' VoiceCraft.Server.Android/EndstoneBridgeController.cs
          check "strong fade exponent" grep -q 'MathF.Pow(linearFactor, 1.5f)' VoiceCraft.Upstream/VoiceCraft.Network/Audio/Effects/ProximityEffect.cs
          check "Endstone source 0.2.17" grep -q 'version = "0.2.17"' VoiceCraft.Endstone/pyproject.toml
          check "production version code 22" grep -q '<ApplicationVersion>22</ApplicationVersion>' VoiceCraft.Server.Android/VoiceCraft.Server.Android.csproj
          check "production display version V3.0.1" grep -q '<ApplicationDisplayVersion>1.7.1-android-phase2-ui5-mcsv-v3.0.2-endweave</ApplicationDisplayVersion>' VoiceCraft.Server.Android/VoiceCraft.Server.Android.csproj
          check "production bridge version V3.0.1" grep -q 'appVersion = "1.7.1-android-phase2-ui5-mcsv-v3.0.2-endweave"' VoiceCraft.Server.Android/EndstoneBridgeController.cs
          check "legal source link" grep -q 'https://github.com/AvionBlock/VoiceCraft' VoiceCraft.Server.Android/ModernMainActivity.cs
          check "GPL notice" grep -q 'GPL-3.0' VoiceCraft.Server.Android/ModernMainActivity.cs

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install .NET Android workload
        run: dotnet workload install android

      - name: Build Android ARM64 APK
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore VoiceCraft.Server.Android/VoiceCraft.Server.Android.csproj
          dotnet build VoiceCraft.Server.Android/VoiceCraft.Server.Android.csproj -c Release --no-restore
          dotnet publish VoiceCraft.Server.Android/VoiceCraft.Server.Android.csproj -c Release -r android-arm64 --no-restore
          mkdir -p test-assets
          signed=$(find VoiceCraft.Server.Android/bin/Release/net10.0-android/android-arm64/publish -maxdepth 1 -name '*-Signed.apk' -print -quit)
          test -n "$signed"
          cp "$signed" test-assets/VoiceCraft-Server-Mobile-MCSV-V3.0.2-Endweave-arm64-Signed.apk
          sha256sum test-assets/VoiceCraft-Server-Mobile-MCSV-V3.0.2-Endweave-arm64-Signed.apk | tee test-assets/APK_SHA256.txt

      - name: Upload production APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceCraft-Server-Mobile-MCSV-V3.0.2-Endweave-Android-arm64
          if-no-files-found: error
          path: |
            test-assets/VoiceCraft-Server-Mobile-MCSV-V3.0.2-Endweave-arm64-Signed.apk
            test-assets/APK_SHA256.txt

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Endstone 0.2.17 wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install build
          python -m compileall -q VoiceCraft.Endstone/src VoiceCraft.Endstone/tests
          (cd VoiceCraft.Endstone && python -m build --wheel)
          wheel=$(find VoiceCraft.Endstone/dist -maxdepth 1 -name 'endstone_voicecraft-0.2.17-*.whl' -print -quit)
          test -n "$wheel"
          cp "$wheel" test-assets/endstone_voicecraft-0.2.17-py3-none-any.whl
          sha256sum test-assets/endstone_voicecraft-0.2.17-py3-none-any.whl | tee test-assets/PLUGIN_SHA256.txt

      - name: Upload Endstone 0.2.17 wheel
        uses: actions/upload-artifact@v4
        with:
          name: VoiceCraft-Endstone-0.2.17
          if-no-files-found: error
          path: |
            test-assets/endstone_voicecraft-0.2.17-py3-none-any.whl
            test-assets/PLUGIN_SHA256.txt
