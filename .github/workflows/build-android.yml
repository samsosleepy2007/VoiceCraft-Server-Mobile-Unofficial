name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, endstone-phase2, modern-azure-ui, feature-item-mic-integration]
    paths:
      - "VoiceCraft.Upstream"
      - "VoiceCraft.Server.Android/**"
      - "VoiceCraft.Endstone/**"
      - "VoiceCraft.Guest.Patch/**"
      - "supabase/functions/voicecraft-mobile/**"
      - "LICENSE.md"
      - "NOTICE.md"
      - "tools/apply_phase1.py"
      - "tools/apply_android_console_fix.py"
      - "tools/apply_android_tcp_mchttp.py"
      - "tools/apply_bridge_runtime.py"
      - "tools/apply_render_api_core.py"
      - "tools/apply_item_mic_bridge_patch.py"
      - "tools/apply_voice_range_patch.py"
      - "tools/apply_mcsv_integration.py"
      - "tools/apply_mcsv_theme_guide_fix.py"
      - ".github/workflows/build-android.yml"
      - ".gitmodules"
  pull_request:
    branches: [main]
    paths:
      - "VoiceCraft.Upstream"
      - "VoiceCraft.Server.Android/**"
      - "VoiceCraft.Endstone/**"
      - "VoiceCraft.Guest.Patch/**"
      - "supabase/functions/voicecraft-mobile/**"
      - "LICENSE.md"
      - "NOTICE.md"
      - "tools/apply_phase1.py"
      - "tools/apply_android_console_fix.py"
      - "tools/apply_android_tcp_mchttp.py"
      - "tools/apply_bridge_runtime.py"
      - "tools/apply_render_api_core.py"
      - "tools/apply_item_mic_bridge_patch.py"
      - "tools/apply_voice_range_patch.py"
      - "tools/apply_mcsv_integration.py"
      - "tools/apply_mcsv_theme_guide_fix.py"
      - ".github/workflows/build-android.yml"
      - ".gitmodules"

jobs:
  build-android-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository and VoiceCraft v1.7.1 submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify pinned upstream version
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C VoiceCraft.Upstream rev-parse HEAD)" = "85aaccccbb58adb23e8c87144e8b1c24bf4b2011"
          test -f LICENSE.md
          test -f NOTICE.md
          cmp -s LICENSE.md VoiceCraft.Upstream/LICENSE.md

      - name: Apply production runtime patches
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply_phase1.py VoiceCraft.Upstream
          python tools/apply_android_console_fix.py VoiceCraft.Upstream
          python tools/apply_android_tcp_mchttp.py VoiceCraft.Upstream
          python tools/apply_bridge_runtime.py VoiceCraft.Upstream
          python tools/apply_render_api_core.py .
          python VoiceCraft.Guest.Patch/apply_guest_account_patch.py .
          python tools/apply_item_mic_bridge_patch.py .
          python tools/apply_voice_range_patch.py .
          python VoiceCraft.Guest.Patch/apply_legal_compliance_patch.py .
          python tools/apply_mcsv_integration.py .
          python tools/apply_mcsv_theme_guide_fix.py .

      - name: Set production Android identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          display = "1.7.1-android-phase2-ui5-mcsv-v1"
          csproj = Path("VoiceCraft.Server.Android/VoiceCraft.Server.Android.csproj")
          text = csproj.read_text(encoding="utf-8")
          text, n1 = re.subn(r"<ApplicationVersion>\d+</ApplicationVersion>", "<ApplicationVersion>18</ApplicationVersion>", text, count=1)
          text, n2 = re.subn(r"<ApplicationDisplayVersion>[^<]+</ApplicationDisplayVersion>", f"<ApplicationDisplayVersion>{display}</ApplicationDisplayVersion>", text, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit("Could not set production Android identity")
          csproj.write_text(text, encoding="utf-8")

          bridge = Path("VoiceCraft.Server.Android/EndstoneBridgeController.cs")
          text = bridge.read_text(encoding="utf-8")
          text, n = re.subn(r'appVersion = "[^"]+"', f'appVersion = "{display}"', text, count=1)
          if n != 1:
              raise SystemExit("Could not set production bridge appVersion")
          bridge.write_text(text, encoding="utf-8")
          PY

      - name: Validate production integration guards
        shell: bash
        run: |
          set -euo pipefail
          check() { echo "[guard] $1"; shift; "$@"; }
          check "MCSV patch scripts compile" python -m compileall -q tools/apply_mcsv_integration.py tools/apply_mcsv_theme_guide_fix.py
          check "MCSV API client" test -f VoiceCraft.Server.Android/McsvApiClient.cs
          check "MCSV installer" test -f VoiceCraft.Server.Android/McsvVoiceCraftInstaller.cs
          check "MCSV token protected" grep -q 'KeystoreJsonStore' VoiceCraft.Server.Android/McsvTokenStore.cs
          check "MCSV fixed API host" grep -q 'https://api.mcsv.me/api/v1/' VoiceCraft.Server.Android/McsvApiClient.cs
          check "MCSV redirects blocked" grep -q 'AllowAutoRedirect = false' VoiceCraft.Server.Android/McsvApiClient.cs
          check "MCSV inline API help" grep -q 'วิธีสร้าง API Key:' VoiceCraft.Server.Android/ModernMainActivity.cs
          check "old API guide button removed" bash -c '! grep -q "ดูวิธีเอา API Key\|HOW TO GET API KEY" VoiceCraft.Server.Android/ModernMainActivity.cs'
          check "MCSV installer wired" grep -q 'McsvVoiceCraftInstaller.InstallAsync' VoiceCraft.Server.Android/ModernMainActivity.cs
          check "canonical Endstone installer wheel" grep -q 'endstone_voicecraft-0.2.8-py3-none-any.whl' VoiceCraft.Server.Android/McsvVoiceCraftInstaller.cs
          check "Item Mic 2.4 installer" grep -q 'v1.7.1-itemmic2.4.0-hidden-single' VoiceCraft.Server.Android/McsvVoiceCraftInstaller.cs
          check "automatic server restart" grep -q 'action = "restart"' VoiceCraft.Server.Android/McsvVoiceCraftInstaller.cs
          check "voice range patch" grep -q 'voicecraft.vr.value.' VoiceCraft.Server.Android/EndstoneBridgeController.cs
          check "strong fade exponent" grep -q '1.5' VoiceCraft.Upstream/VoiceCraft.Network/Audio/Effects/ProximityEffect.cs
          check "Endstone source 0.2.8" grep -q 'version = "0.2.8"' VoiceCraft.Endstone/pyproject.toml
          check "production version code" grep -q '<ApplicationVersion>18</ApplicationVersion>' VoiceCraft.Server.Android/VoiceCraft.Server.Android.csproj
          check "production display version" grep -q '<ApplicationDisplayVersion>1.7.1-android-phase2-ui5-mcsv-v1</ApplicationDisplayVersion>' VoiceCraft.Server.Android/VoiceCraft.Server.Android.csproj
          check "production bridge version" grep -q 'appVersion = "1.7.1-android-phase2-ui5-mcsv-v1"' VoiceCraft.Server.Android/EndstoneBridgeController.cs
          check "legal source link" grep -q 'https://github.com/AvionBlock/VoiceCraft' VoiceCraft.Server.Android/ModernMainActivity.cs
          check "GPL notice" grep -q 'GPL-3.0' VoiceCraft.Server.Android/ModernMainActivity.cs

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install .NET Android workload
        run: dotnet workload install android

      - name: Build Android ARM64 APK
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore VoiceCraft.Server.Android/VoiceCraft.Server.Android.csproj
          dotnet build VoiceCraft.Server.Android/VoiceCraft.Server.Android.csproj -c Release --no-restore
          dotnet publish VoiceCraft.Server.Android/VoiceCraft.Server.Android.csproj -c Release -r android-arm64 --no-restore
          mkdir -p test-assets
          signed=$(find VoiceCraft.Server.Android/bin/Release/net10.0-android/android-arm64/publish -maxdepth 1 -name '*-Signed.apk' -print -quit)
          test -n "$signed"
          cp "$signed" test-assets/VoiceCraft-Server-Mobile-MCSV-V1-arm64-Signed.apk
          sha256sum test-assets/VoiceCraft-Server-Mobile-MCSV-V1-arm64-Signed.apk | tee test-assets/APK_SHA256.txt

      - name: Upload production APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceCraft-Server-Mobile-MCSV-V1-Android-arm64
          if-no-files-found: error
          path: |
            test-assets/VoiceCraft-Server-Mobile-MCSV-V1-arm64-Signed.apk
            test-assets/APK_SHA256.txt

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Endstone 0.2.8 wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install build
          python -m compileall -q VoiceCraft.Endstone/src VoiceCraft.Endstone/tests
          (cd VoiceCraft.Endstone && python -m build --wheel)
          wheel=$(find VoiceCraft.Endstone/dist -maxdepth 1 -name 'endstone_voicecraft-0.2.8-*.whl' -print -quit)
          test -n "$wheel"
          cp "$wheel" test-assets/endstone_voicecraft-0.2.8-py3-none-any.whl
          sha256sum test-assets/endstone_voicecraft-0.2.8-py3-none-any.whl | tee test-assets/PLUGIN_SHA256.txt

      - name: Upload Endstone 0.2.8 wheel
        uses: actions/upload-artifact@v4
        with:
          name: VoiceCraft-Endstone-0.2.8
          if-no-files-found: error
          path: |
            test-assets/endstone_voicecraft-0.2.8-py3-none-any.whl
            test-assets/PLUGIN_SHA256.txt
