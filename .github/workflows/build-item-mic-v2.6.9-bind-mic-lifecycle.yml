name: Build Item Mic 2.6.9 Bind Mic Lifecycle

on:
  push:
    branches: [mcsv-endweave-v2]
    paths:
      - "tools/build_item_mic_addon.py"
      - "tools/build_item_mic_voice_range_addon.py"
      - "tools/build_item_mic_v2_5_ddui_addon.py"
      - "tools/build_item_mic_v2_5_5_ddui_addon.py"
      - "tools/build_item_mic_v2_6_5_ddui_bind_addon.py"
      - "tools/build_item_mic_v2_6_6_ddui_bind_addon.py"
      - "tools/build_item_mic_v2_6_7_ddui_bind_addon.py"
      - "tools/build_item_mic_v2_6_8_ddui_bind_addon.py"
      - "tools/build_item_mic_v2_6_9_ddui_bind_addon.py"
      - ".github/workflows/build-item-mic-v2.6.9-bind-mic-lifecycle.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/build_item_mic_addon.py"
      - "tools/build_item_mic_voice_range_addon.py"
      - "tools/build_item_mic_v2_5_ddui_addon.py"
      - "tools/build_item_mic_v2_5_5_ddui_addon.py"
      - "tools/build_item_mic_v2_6_5_ddui_bind_addon.py"
      - "tools/build_item_mic_v2_6_6_ddui_bind_addon.py"
      - "tools/build_item_mic_v2_6_7_ddui_bind_addon.py"
      - "tools/build_item_mic_v2_6_8_ddui_bind_addon.py"
      - "tools/build_item_mic_v2_6_9_ddui_bind_addon.py"
      - ".github/workflows/build-item-mic-v2.6.9-bind-mic-lifecycle.yml"
  workflow_dispatch:

jobs:
  build-addon:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: python -m pip install pillow

      - name: Compile builders
        run: |
          set -euo pipefail
          python -m py_compile             tools/build_item_mic_addon.py             tools/build_item_mic_voice_range_addon.py             tools/build_item_mic_v2_5_ddui_addon.py             tools/build_item_mic_v2_5_5_ddui_addon.py             tools/build_item_mic_v2_6_5_ddui_bind_addon.py             tools/build_item_mic_v2_6_6_ddui_bind_addon.py             tools/build_item_mic_v2_6_7_ddui_bind_addon.py             tools/build_item_mic_v2_6_8_ddui_bind_addon.py             tools/build_item_mic_v2_6_9_ddui_bind_addon.py

      - name: Build addon
        run: |
          set -euo pipefail
          mkdir -p test-assets
          python tools/build_item_mic_v2_6_9_ddui_bind_addon.py             .             test-assets/VoiceCraft_ItemMic_v2.6.9_DDUI-Bind.mcaddon
          test -s test-assets/VoiceCraft_ItemMic_v2.6.9_DDUI-Bind.mcaddon

      - name: Validate Bind Mic withholding lifecycle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf check
          mkdir -p check/top check/bp check/rp

          unzip -q test-assets/VoiceCraft_ItemMic_v2.6.9_DDUI-Bind.mcaddon -d check/top
          unzip -q check/top/VoiceCraft_ItemMic_BP_v2.6.9.mcpack -d check/bp
          unzip -q check/top/VoiceCraft_ItemMic_RP_v2.6.9.mcpack -d check/rp

          test "$(jq -r '.header.version | join(".")' check/bp/manifest.json)" = "2.6.9"
          test "$(jq -r '.header.version | join(".")' check/rp/manifest.json)" = "2.6.9"
          test "$(jq -r '.dependencies[] | select(.module_name=="@minecraft/server-ui") | .version' check/bp/manifest.json)" = "2.1.0"
          test "$(jq -r '.dependencies[] | select(.module_name=="@minecraft/server") | .version' check/bp/manifest.json)" = "2.9.0"

          script=check/bp/scripts/main.js
          node --check "$script"

          grep -Fq 'const bindMicWithheldPlayers = new Set();' "$script"
          grep -Fq 'const bindMicRestoreSlots = new Map();' "$script"
          grep -Fq 'function removeAllMicsForBind(player)' "$script"
          grep -Fq 'function withholdMicForBind(player)' "$script"
          grep -Fq 'function restoreMicAfterBind(player)' "$script"
          grep -Fq 'function syncMicWithBindState(player)' "$script"
          grep -Fq 'MIC_WITHHELD_FOR_BIND' "$script"
          grep -Fq 'MIC_RETURNED_AFTER_BIND' "$script"
          grep -Fq 'Loaded v2.6.9' "$script"

          python - <<'PY'
          from pathlib import Path

          text = Path("check/bp/scripts/main.js").read_text(encoding="utf-8")

          # Auto-give must be blocked while Bind owns the Mic lifecycle.
          ensure_start = text.index("function ensureMic(player)")
          ensure_end = text.index("function migrateLegacy", ensure_start)
          ensure = text[ensure_start:ensure_end]
          assert "bindMicWithheldPlayers.has(player.id)" in ensure
          assert "removeAllMicsForBind(player);" in ensure
          assert ensure.index("bindMicWithheldPlayers.has(player.id)") < ensure.index("if (hasAnyMic(player)) return;")

          # Opening any Bind DDUI removes the Mic before the form is marked open.
          show_start = text.index("async function showBindDdui(player, openToken)")
          show_end = text.index("function pollBindDdui", show_start)
          show = text[show_start:show_end]
          assert 'if (bindState(player) === "bound")' in show
          assert "withholdMicForBind(player);" in show
          assert show.index("withholdMicForBind(player);") < show.index("openBindPlayers.add(player.id);")
          assert "restoreMicAfterBind(player);" in show

          # Inventory + offhand are both cleared.
          remove_start = text.index("function removeAllMicsForBind(player)")
          remove_end = text.index("function withholdMicForBind", remove_start)
          remove = text[remove_start:remove_end]
          assert "inv.setItem(i, undefined);" in remove
          assert "eq.setEquipment(EquipmentSlot.Offhand, undefined);" in remove

          # Restore happens only after authoritative bound state is visible.
          sync_start = text.index("function syncMicWithBindState(player)")
          sync_end = text.index("function ensureMic", sync_start)
          sync = text[sync_start:sync_end]
          assert 'if (state === "bound")' in sync
          assert "restoreMicAfterBind(player);" in sync
          assert "removeAllMicsForBind(player);" in sync

          poll_start = text.index("function pollBindDdui(player)")
          poll_end = text.index("world.afterEvents.playerSpawn.subscribe", poll_start)
          poll = text[poll_start:poll_end]
          assert "syncMicWithBindState(player);" in poll

          # Accepted systems from 2.6.8/2.6.6/2.6.5 remain.
          assert "voicecraft.bind.check." in text
          assert "voicecraft.bind.check_result." in text
          assert "function routeMicByAuthoritativeState(player, state)" in text
          assert "voicecraft.vr.ack." in text
          assert "voicecraft.vr.sync." in text
          assert "submittedCloseRequested" in text
          assert "bind DDUI submit-close failed" in text

          print("Item Mic 2.6.9 Bind Mic lifecycle verified")
          PY

          ! grep -Fq 'ActionFormData' "$script"
          ! grep -Fq 'ModalFormData' "$script"
          ! grep -Fq 'multiButtonRow' "$script"

          test -s check/rp/attachables/mic_off.entity.json
          test -s check/rp/models/entity/voicecraft_mic_invisible.geo.json

      - name: Confirm 2.6.8 rollback still builds
        run: |
          set -euo pipefail
          python tools/build_item_mic_v2_6_8_ddui_bind_addon.py             .             test-assets/VoiceCraft_ItemMic_v2.6.8_DDUI-Bind_rollback.mcaddon
          test -s test-assets/VoiceCraft_ItemMic_v2.6.8_DDUI-Bind_rollback.mcaddon

      - name: Upload addon
        uses: actions/upload-artifact@v4
        with:
          name: VoiceCraft-ItemMic-v2.6.9-Bind-Mic-Lifecycle
          path: test-assets/VoiceCraft_ItemMic_v2.6.9_DDUI-Bind.mcaddon
          if-no-files-found: error
